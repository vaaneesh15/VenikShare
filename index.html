<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dvexland - заявки</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #121016;
      color: #eae6f0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-top: 90px;
    }

    nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1b1922;
      padding: 10px 20px;
      border-bottom: 1px solid #2b2635;
      z-index: 20;
    }
    nav a, nav button {
      color: #c5bfd4;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 15px;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    nav a.active {
      background: #3a3152;
      color: #e3d9ff;
    }
    nav a:hover:not(.active) { background: #252232; }

    .nav-icon {
      width: 20px; height: 20px;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    #refreshBtn, #discordBtn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #refreshBtn { margin-left: auto; }
    #refreshBtn:hover, #discordBtn:hover { background: #252232; }

    .container { max-width: 720px; margin: 0 auto; padding: 0 20px 40px; }

    .card {
      background: #1e1b26;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
      border: 1px solid #2a2536;
      transition: border 0.2s;
      position: relative;
    }
    .card:hover { border-color: #4a3f62; }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #cbbef0; }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: #16131e;
      border: 1px solid #332e42;
      border-radius: 12px;
      font-size: 15px;
      color: #eae6f0;
      transition: border 0.2s, background 0.2s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #7e6ab3;
      background: #1c1926;
    }
    textarea { resize: vertical; min-height: 100px; }

    .buttons { display: flex; gap: 10px; margin-top: 8px; }
    .buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .buttons button:active { transform: scale(0.98); }

    .btn-primary { background: #6c52b3; color: white; }
    .btn-primary:hover { background: #7e62cc; }
    .btn-secondary { background: #262231; color: #ccc0e8; border: 1px solid #3b334a; }
    .btn-secondary:hover { background: #302a3d; }
    .btn-danger { background: #3d1e28; color: #f5a3b3; border: 1px solid #5a2e3a; }
    .btn-danger:hover { background: #4c2632; }

    .status {
      display: inline-block;
      font-weight: 600;
      font-size: 13px;
      padding: 2px 12px;
      border-radius: 20px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #1f1b2b;
      padding: 24px;
      border-radius: 20px;
      width: 320px;
      border: 1px solid #3a3050;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .admin-btn {
      display: inline-block;
      margin-right: 8px;
      background: #4b3a72;
      color: #ddd0ff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .admin-btn.reject { background: #6b2c38; color: #ffc2cc; }
    .admin-btn.reject:hover { background: #853b48; }
    .admin-btn.accept:hover { background: #5c4990; }

    .withdraw-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #6b2c38;
      color: #ffc2cc;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .withdraw-btn:hover { background: #853b48; }

    .hidden { display: none; }
    .app-field { margin-bottom: 6px; }
    .app-field strong { color: #b6a8d6; }

    h2, h3 { color: #ede4ff; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <a href="#" id="feedTab" class="active">Лента анкет</a>
    <a href="#" id="myTab">Моя анкета</a>
    <button id="refreshBtn" title="Обновить">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
    <a href="https://discord.gg/S2H95jMtFr" target="_blank" id="discordBtn" title="Discord сервер">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
    </a>
  </nav>

  <div class="container">
    <div id="feedSection">
      <h2 style="margin-bottom:16px;">Все анкеты</h2>
      <div id="feedList"></div>
    </div>

    <div id="mySection" class="hidden">
      <div id="myFormBlock">
        <h2 style="margin-bottom:16px;">Новая анкета</h2>
        <div class="form-group"><label>Ник</label><input id="nickname" type="text" placeholder="Ваш игровой ник"></div>
        <div class="form-group"><label>Описание</label><textarea id="description" minlength="20" maxlength="350" placeholder="Например, откуда узнали о сервере, чем планируете заниматься, соглашаетесь ли Вы не гриферить и не читерить и так далее… (от 20 до 350 символов)"></textarea></div>
        <div class="form-group"><label>Возраст</label><input id="age" type="number" min="1" max="99" placeholder="Возраст"></div>
        <div class="form-group">
          <label>Пол</label>
          <select id="gender">
            <option value="">— выберите —</option>
            <option>Мужской</option>
            <option>Женский</option>
            <option>Не важно</option>
          </select>
        </div>
        <div class="buttons">
          <button id="resetBtn" class="btn-secondary">Сброс анкеты</button>
          <button id="submitBtn" class="btn-primary">Отправить</button>
        </div>
      </div>
      <div id="myApplicationBlock" class="hidden">
        <!-- динамическое содержимое -->
      </div>
    </div>
  </div>

  <!-- Вход администратора -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:16px;">Вход администратора</h3>
      <div class="form-group"><label>Ник</label><input id="adminUsername" type="text"></div>
      <div class="form-group"><label>Пароль</label><input id="adminPassword" type="password"></div>
      <div class="buttons">
        <button id="adminCancel" class="btn-secondary">Отмена</button>
        <button id="adminLogin" class="btn-primary">Войти</button>
      </div>
    </div>
  </div>

  <!-- Выход администратора -->
  <div id="adminLogoutModal" class="modal">
    <div class="modal-content">
      <p style="margin-bottom:16px;">Вы уверены, что хотите выйти из аккаунта администратора?</p>
      <div class="buttons">
        <button id="adminLogoutCancel" class="btn-secondary">Отмена</button>
        <button id="adminLogoutConfirm" class="btn-danger">Да</button>
      </div>
    </div>
  </div>

  <!-- Подтверждение действия админа -->
  <div id="adminActionModal" class="modal">
    <div class="modal-content">
      <p id="adminActionText" style="margin-bottom:16px;"></p>
      <div class="buttons">
        <button id="adminActionCancel" class="btn-secondary">Отмена</button>
        <button id="adminActionConfirm" class="btn-primary">Подтвердить</button>
      </div>
    </div>
  </div>

  <!-- Удаление анкеты админом -->
  <div id="adminDeleteModal" class="modal">
    <div class="modal-content">
      <p style="margin-bottom:16px;">Вы уверены, что хотите удалить анкету? Это действие необратимо.</p>
      <div class="buttons">
        <button id="adminDeleteCancel" class="btn-secondary">Отмена</button>
        <button id="adminDeleteConfirm" class="btn-danger">Удалить</button>
      </div>
    </div>
  </div>

  <!-- Отзыв анкеты -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <p style="margin-bottom:16px;">Вы уверены, что хотите отозвать анкету?</p>
      <div class="buttons">
        <button id="withdrawCancel" class="btn-secondary">Отмена</button>
        <button id="withdrawConfirm" class="btn-danger">Отозвать</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let currentTab = 'feed';
    let isAdmin = false;
    let adminToken = localStorage.getItem('adminToken');
    let feedData = [];
    let myAppData = null;

    if (adminToken) isAdmin = true;

    // Навигация
    document.getElementById('feedTab').addEventListener('click', (e) => { e.preventDefault(); switchTab('feed'); });
    document.getElementById('myTab').addEventListener('click', (e) => { e.preventDefault(); switchTab('my'); });
    document.getElementById('refreshBtn').addEventListener('click', () => {
      if (currentTab === 'feed') refreshFeed();
      else loadMyApplication();
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('feedTab').classList.toggle('active', tab === 'feed');
      document.getElementById('myTab').classList.toggle('active', tab === 'my');
      document.getElementById('feedSection').classList.toggle('hidden', tab !== 'feed');
      document.getElementById('mySection').classList.toggle('hidden', tab !== 'my');
    }

    // 7 кликов для входа/выхода
    let clickCount = 0;
    let clickTimer = null;
    document.getElementById('feedTab').addEventListener('click', (e) => {
      clickCount++;
      clearTimeout(clickTimer);
      if (clickCount >= 7) {
        clickCount = 0;
        if (isAdmin) showAdminLogout();
        else showAdminLogin();
      } else {
        clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
      }
    });

    // Админ: вход
    const adminModal = document.getElementById('adminModal');
    function showAdminLogin() {
      adminModal.style.display = 'flex';
      document.getElementById('adminUsername').value = '';
      document.getElementById('adminPassword').value = '';
    }
    document.getElementById('adminCancel').addEventListener('click', () => { adminModal.style.display = 'none'; });
    document.getElementById('adminLogin').addEventListener('click', async () => {
      const username = document.getElementById('adminUsername').value;
      const password = document.getElementById('adminPassword').value;
      try {
        const res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) throw new Error('Неверные данные');
        const data = await res.json();
        adminToken = data.token;
        isAdmin = true;
        localStorage.setItem('adminToken', adminToken);
        adminModal.style.display = 'none';
        refreshFeed();
      } catch(e) {
        alert('Ошибка входа: ' + e.message);
      }
    });

    // Админ: выход
    const adminLogoutModal = document.getElementById('adminLogoutModal');
    function showAdminLogout() {
      adminLogoutModal.style.display = 'flex';
    }
    document.getElementById('adminLogoutCancel').addEventListener('click', () => { adminLogoutModal.style.display = 'none'; });
    document.getElementById('adminLogoutConfirm').addEventListener('click', () => {
      adminToken = null;
      isAdmin = false;
      localStorage.removeItem('adminToken');
      adminLogoutModal.style.display = 'none';
      refreshFeed();
    });

    // Подтверждение админ-действия
    const adminActionModal = document.getElementById('adminActionModal');
    const adminActionText = document.getElementById('adminActionText');
    const adminActionConfirm = document.getElementById('adminActionConfirm');
    let pendingAdminAction = null;

    function showAdminActionModal(appId, action) {
      pendingAdminAction = { appId, action };
      adminActionText.textContent = `Вы уверены, что хотите ${action === 'accept' ? 'принять' : 'отклонить'} эту анкету?`;
      adminActionConfirm.textContent = action === 'accept' ? 'Принять' : 'Отклонить';
      adminActionConfirm.className = action === 'accept' ? 'btn-primary' : 'btn-danger';
      adminActionModal.style.display = 'flex';
    }

    document.getElementById('adminActionCancel').addEventListener('click', () => {
      adminActionModal.style.display = 'none';
      pendingAdminAction = null;
    });

    adminActionConfirm.addEventListener('click', async () => {
      if (!pendingAdminAction) return;
      const { appId, action } = pendingAdminAction;
      try {
        const endpoint = action === 'accept' ? 'accept' : 'reject';
        const res = await fetch(`${API_BASE}/api/applications/${appId}/${endpoint}`, {
          method: 'PATCH',
          headers: { 'X-Admin-Token': adminToken }
        });
        if (!res.ok) throw new Error('Ошибка');
        adminActionModal.style.display = 'none';
        pendingAdminAction = null;
        refreshFeed();
      } catch(e) {
        alert('Не удалось выполнить действие');
      }
    });

    // Удаление анкеты админом (тройной клик + модалка)
    const adminDeleteModal = document.getElementById('adminDeleteModal');
    const adminDeleteConfirm = document.getElementById('adminDeleteConfirm');
    let deleteTargetId = null;

    function showAdminDeleteModal(appId) {
      deleteTargetId = appId;
      adminDeleteModal.style.display = 'flex';
    }

    document.getElementById('adminDeleteCancel').addEventListener('click', () => {
      adminDeleteModal.style.display = 'none';
      deleteTargetId = null;
    });

    adminDeleteConfirm.addEventListener('click', async () => {
      if (!deleteTargetId) return;
      try {
        const res = await fetch(`${API_BASE}/api/applications/${deleteTargetId}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Token': adminToken }
        });
        if (!res.ok) throw new Error('Ошибка');
        adminDeleteModal.style.display = 'none';
        deleteTargetId = null;
        refreshFeed();
      } catch(e) {
        alert('Не удалось удалить анкету');
      }
    });

    // Тройной клик по карточке для админа
    let cardClickTimers = {};
    function handleCardTripleClick(appId) {
      if (!isAdmin) return;
      if (!cardClickTimers[appId]) {
        cardClickTimers[appId] = { count: 0, timer: null };
      }
      const tracker = cardClickTimers[appId];
      tracker.count++;
      if (tracker.count >= 3) {
        clearTimeout(tracker.timer);
        tracker.count = 0;
        showAdminDeleteModal(appId);
      } else {
        clearTimeout(tracker.timer);
        tracker.timer = setTimeout(() => { tracker.count = 0; }, 2000);
      }
    }

    // Лента анкет
    async function refreshFeed() {
      const feedList = document.getElementById('feedList');
      feedList.innerHTML = '<p>Загрузка...</p>';
      try {
        const headers = {};
        if (adminToken) headers['X-Admin-Token'] = adminToken;
        const res = await fetch(API_BASE + '/api/applications', { headers });
        feedData = await res.json();
        renderFeed();
      } catch(e) {
        feedList.innerHTML = '<p>Ошибка загрузки</p>';
      }
    }

    function statusBadge(status) {
      const colorMap = {
        'Актуально': { bg: '#3e2e5c', color: '#cbbef0' },
        'Принято': { bg: '#1e3b2f', color: '#a0d9b4' },
        'Отклонено': { bg: '#4a2632', color: '#f5a3b3' },
        'Отозвано': { bg: '#2a2533', color: '#8e8a9e' },
        'Отозвано после отказа': { bg: '#3d2a2e', color: '#e5989b' }
      };
      const style = colorMap[status] || { bg: '#2a2533', color: '#8e8a9e' };
      return `<span class="status" style="background:${style.bg}; color:${style.color}">${status}</span>`;
    }

    function renderFeed() {
      const feedList = document.getElementById('feedList');
      if (!feedData.length) {
        feedList.innerHTML = '<p>Нет анкет.</p>';
        return;
      }
      feedList.innerHTML = feedData.map(app => {
        let adminButtons = '';
        if (isAdmin && app.status === 'Актуально') {
          adminButtons = `
            <div style="margin-top:14px; display:flex; gap:10px;">
              <button class="admin-btn accept" data-id="${app.id}">Принять</button>
              <button class="admin-btn reject" data-id="${app.id}">Отклонить</button>
            </div>`;
        }
        const descriptionRow = (isAdmin && app.description)
          ? `<div class="app-field"><strong>Описание:</strong> ${app.description}</div>`
          : '';
        return `<div class="card" data-app-id="${app.id}">
          <div class="app-field"><strong>Ник:</strong> ${app.nickname}</div>
          ${descriptionRow}
          <div class="app-field"><strong>Пол:</strong> ${app.gender}</div>
          <div class="app-field"><strong>Возраст:</strong> ${app.age}</div>
          <div class="app-field"><strong>Статус:</strong> ${statusBadge(app.status)}</div>
          <div class="app-field"><strong>Отправлено:</strong> ${app.createdAt}</div>
          ${adminButtons}
        </div>`;
      }).join('');

      // Обработчики на админские кнопки
      document.querySelectorAll('.admin-btn.accept').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          showAdminActionModal(e.target.dataset.id, 'accept');
        });
      });
      document.querySelectorAll('.admin-btn.reject').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          showAdminActionModal(e.target.dataset.id, 'reject');
        });
      });

      // Тройной клик по карточке
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', (e) => {
          // Не обрабатываем клики по кнопкам внутри
          if (e.target.tagName === 'BUTTON') return;
          const appId = card.dataset.appId;
          if (appId) handleCardTripleClick(appId);
        });
      });
    }

    // Моя анкета
    async function loadMyApplication() {
      const id = localStorage.getItem('myApplicationId');
      if (!id) {
        myAppData = null;
        showForm();
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/applications/${id}`);
        if (!res.ok) {
          localStorage.removeItem('myApplicationId');
          myAppData = null;
          showForm();
          return;
        }
        myAppData = await res.json();
        showMyApplication();
      } catch(e) {
        myAppData = null;
        showForm();
      }
    }

    function showForm() {
      document.getElementById('myFormBlock').classList.remove('hidden');
      document.getElementById('myApplicationBlock').classList.add('hidden');
      document.getElementById('nickname').value = '';
      document.getElementById('description').value = '';
      document.getElementById('age').value = '';
      document.getElementById('gender').value = '';
    }

    function showMyApplication() {
      if (!myAppData) return;
      const app = myAppData;
      document.getElementById('myFormBlock').classList.add('hidden');
      const block = document.getElementById('myApplicationBlock');
      block.classList.remove('hidden');
      let withdrawBtn = '';
      if (app.status !== 'Принято' && app.status !== 'Отозвано' && app.status !== 'Отозвано после отказа') {
        withdrawBtn = `<button id="withdrawBtn" class="withdraw-btn">Отозвать анкету</button>`;
      }
      block.innerHTML = `<div class="card">
        <h3 style="margin-bottom:12px;">Моя анкета</h3>
        <div class="app-field"><strong>Ник:</strong> ${app.nickname}</div>
        <div class="app-field"><strong>Описание:</strong> ${app.description}</div>
        <div class="app-field"><strong>Возраст:</strong> ${app.age}</div>
        <div class="app-field"><strong>Пол:</strong> ${app.gender}</div>
        <div class="app-field"><strong>Статус:</strong> ${statusBadge(app.status)}</div>
        <div class="app-field"><strong>Отправлено:</strong> ${app.createdAt}</div>
        ${withdrawBtn}
      </div>`;
      if (withdrawBtn) {
        document.getElementById('withdrawBtn').addEventListener('click', showWithdrawModal);
      }
    }

    // Отправка анкеты
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const nickname = document.getElementById('nickname').value.trim();
      const description = document.getElementById('description').value.trim();
      const age = document.getElementById('age').value.trim();
      const gender = document.getElementById('gender').value;
      if (!nickname || !description || !age || !gender) return alert('Заполните все поля');
      if (description.length < 20 || description.length > 350) return alert('Описание должно быть от 20 до 350 символов');
      const ageNum = parseInt(age, 10);
      if (isNaN(ageNum) || ageNum < 1 || ageNum > 99) return alert('Возраст должен быть от 1 до 99');
      try {
        const res = await fetch(API_BASE + '/api/applications', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, description, age: ageNum, gender })
        });
        if (!res.ok) {
          const err = await res.json();
          return alert(err.error);
        }
        const app = await res.json();
        localStorage.setItem('myApplicationId', app.id);
        myAppData = app;
        showMyApplication();
      } catch(e) {
        alert('Ошибка отправки');
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('nickname').value = '';
      document.getElementById('description').value = '';
      document.getElementById('age').value = '';
      document.getElementById('gender').value = '';
    });

    // Отзыв анкеты
    const withdrawModal = document.getElementById('withdrawModal');
    function showWithdrawModal() {
      withdrawModal.style.display = 'flex';
    }
    document.getElementById('withdrawCancel').addEventListener('click', () => {
      withdrawModal.style.display = 'none';
    });
    document.getElementById('withdrawConfirm').addEventListener('click', async () => {
      const id = localStorage.getItem('myApplicationId');
      if (!id) return;
      try {
        const res = await fetch(`${API_BASE}/api/applications/${id}/withdraw`, { method: 'PATCH' });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
        } else {
          const updated = await res.json();
          if (updated.status === 'Отозвано' || updated.status === 'Отозвано после отказа') {
            localStorage.removeItem('myApplicationId');
            myAppData = null;
            withdrawModal.style.display = 'none';
            showForm();
            if (currentTab === 'feed') refreshFeed();
          } else {
            // на случай, если статус не поменялся
            myAppData = updated;
            showMyApplication();
            withdrawModal.style.display = 'none';
          }
        }
      } catch(e) {
        alert('Ошибка');
      }
    });

    // Первоначальная загрузка
    refreshFeed();
    loadMyApplication();
  </script>
</body>
</html>
