<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatX</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChatX">
    <meta name="theme-color" id="theme-color-meta" content="#000000">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
        html,body { overscroll-behavior:none; overflow:hidden; width:100%; height:100%; background:transparent; }
        body { --bg-gradient-start:#e9e9f0; --bg-gradient-end:#dadde8; --container-bg:rgba(240,240,245,0.7); --container-border:rgba(255,255,255,0.5); --text-primary:#1a1a2e; --text-secondary:#2c3e50; --text-muted:#6b6b80; --accent:#4a3aff; --accent-light:#7a6aff; --card-bg:rgba(255,255,255,0.6); --card-border:rgba(255,255,255,0.6); --shadow:0 25px 50px -12px rgba(0,0,0,0.2); --icon-bg:white; --panel-bg:rgba(255,255,255,0.7); --input-bg:rgba(255,255,255,0.5); --chat-own-bg:var(--accent); --chat-other-bg:#e0e0f0; --chat-own-text:white; --chat-other-text:#1a1a2e; transition:background 0.2s,color 0.2s; background:linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end)) fixed; position:relative; }
        body::after { content:''; position:fixed; top:-50vh; left:-50vw; width:200vw; height:200vh; background:inherit; z-index:-1; }
        body.dark { --bg-gradient-start:#000000; --bg-gradient-end:#121212; --container-bg:rgba(0,0,0,0.8); --container-border:rgba(255,255,255,0.15); --text-primary:#f0f0ff; --text-secondary:#ecf0f1; --text-muted:#8a8aa0; --accent:#6d5fff; --accent-light:#9a8cff; --card-bg:rgba(20,20,30,0.7); --card-border:rgba(255,255,255,0.1); --shadow:0 25px 50px -12px rgba(0,0,0,0.6); --icon-bg:#1e1e2a; --panel-bg:rgba(0,0,0,0.8); --input-bg:rgba(20,20,30,0.6); --chat-other-bg:#2a2a3a; --chat-other-text:#ffffff; }
        .btn,.back-btn,.theme-toggle,.participant-count,.info-btn,#public-send,#local-send,#auth-login,#auth-register,#logout-btn,#delete-account-btn,.modal .btn,.attach-btn,.avatar-upload-btn { transition:opacity 0.1s ease; touch-action:manipulation; cursor:pointer; }
        .btn:active,.back-btn:active,.theme-toggle:active,.participant-count:active,.info-btn:active,#public-send:active,#local-send:active,#auth-login:active,#auth-register:active,#logout-btn:active,#delete-account-btn:active,.modal .btn:active,.attach-btn:active,.avatar-upload-btn:active { opacity:0.7; }
        .app { width:100%; height:100%; position:relative; display:flex; flex-direction:column; padding-bottom: env(safe-area-inset-bottom); }
        .screen { width:100%; height:100%; position:absolute; top:0; left:0; transition:opacity 0.3s; display:flex; flex-direction:column; overflow:hidden; }
        .screen-hidden { opacity:0; pointer-events:none; }
        #main-screen { display:flex; flex-direction:column; height:100%; position:relative; overflow:hidden; }
        .screen-container { flex:1; position:relative; overflow:hidden; }
        .inner-screen { position:absolute; top:0; left:0; width:100%; height:100%; transition:opacity 0.3s; display:flex; flex-direction:column; overflow:hidden; }
        .inner-screen-hidden { opacity:0; pointer-events:none; }
        .page-header,.chat-header { display:flex; align-items:center; justify-content:space-between; padding:max(30px, env(safe-area-inset-top)) 16px 12px 16px; border-bottom:1px solid var(--container-border); background:var(--container-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); flex-shrink:0; min-height:70px; }
        .page-header h2,.chat-header-left h2 { font-size:24px; font-weight:600; color:var(--text-primary); margin:0; }
        .theme-toggle { background:var(--icon-bg); width:44px; height:44px; border-radius:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 12px rgba(0,0,0,0.05); cursor:pointer; border:1px solid var(--container-border); color:var(--accent); font-size:20px; }
        .chat-header-left { display:flex; align-items:center; gap:12px; }
        .chat-header-left .back-btn { background:var(--icon-bg); width:40px; height:40px; border-radius:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 12px rgba(0,0,0,0.05); cursor:pointer; border:1px solid var(--container-border); color:var(--accent); font-size:20px; }
        .participant-count { background:var(--icon-bg); border-radius:30px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:var(--accent); border:1px solid var(--card-border); cursor:pointer; }
        .bottom-nav { display:flex; align-items:center; justify-content:space-around; margin:8px 16px 16px 16px; padding:6px 8px 8px 8px; background:var(--panel-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:40px; border:1px solid var(--container-border); box-shadow:var(--shadow); flex-shrink:0; }
        .page-content { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; }
        .panel { background:var(--panel-bg); backdrop-filter:blur(10px); border-radius:36px; padding:20px 16px; border:1px solid var(--container-border); box-shadow:var(--shadow); margin-bottom:16px; }
        .input-group { display:flex; gap:8px; margin-bottom:12px; }
        .input-group input { flex:1; background:var(--input-bg); border:1px solid var(--card-border); border-radius:40px; padding:14px 18px; font-size:16px; color:var(--text-primary); outline:none; }
        .btn { background:var(--icon-bg); border:1px solid var(--card-border); border-radius:40px; padding:14px 24px; font-size:16px; font-weight:600; color:var(--accent); cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.05); white-space:nowrap; width:100%; text-align:center; }
        .btn-primary { background:var(--accent); color:white; border:none; }
        .btn-small { padding:12px 20px; font-size:14px; }
        .status { text-align:center; color:var(--text-muted); margin:8px 0; font-size:14px; }
        .flex-col { display:flex; flex-direction:column; gap:12px; }
        .flex-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; color:var(--text-muted); font-size:12px; cursor:pointer; padding:8px 0; border-radius:30px; position:relative; }
        .nav-item i { font-size:22px; margin-bottom:2px; }
        .nav-item span { font-size:11px; font-weight:500; }
        .nav-item.active { color:var(--accent); background:rgba(74,58,255,0.1); }
        body.dark .nav-item.active { background:rgba(109,95,255,0.2); }
        .chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:4px; min-height:0; }
        .message { display:flex; margin-bottom:4px; position:relative; align-items:flex-start; gap:8px; }
        .message-own { justify-content:flex-end; }
        .message-avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; background:var(--icon-bg); border:1px solid var(--card-border); flex-shrink:0; cursor:pointer; }
        .message-own .message-avatar { display:none; }
        .message-content { display:flex; flex-direction:column; max-width:calc(80% - 48px); }
        .message-bubble { background:var(--chat-other-bg); border-radius:24px; padding:10px 16px; border:1px solid var(--card-border); word-break:break-word; color:var(--chat-other-text); position:relative; }
        .message-bubble-own { background:var(--chat-own-bg); color:var(--chat-own-text); border-color:var(--accent-light); }
        .message-sender { font-size:13px; font-weight:600; margin-bottom:4px; color:var(--accent); }
        .message-text { font-size:15px; line-height:1.4; }
        .message-time { font-size:11px; opacity:0.7; margin-top:4px; text-align:right; }
        .message-media { max-width:200px; max-height:200px; border-radius:16px; cursor:pointer; margin-bottom:30px; display:block; }
        .message-download-btn { position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,0.5); color:white; border-radius:20px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; font-size:16px; z-index:2; }
        .date-separator { display:flex; justify-content:center; margin:12px 0; }
        .date-separator span { background:var(--panel-bg); backdrop-filter:blur(10px); padding:4px 16px; border-radius:30px; font-size:13px; color:var(--text-muted); border:1px solid var(--container-border); }
        .chat-input-area { display:flex; align-items:flex-end; gap:8px; padding:8px 16px 12px 16px; border-top:1px solid var(--container-border); background:var(--panel-bg); backdrop-filter:blur(10px); flex-shrink:0; }
        .chat-input-area textarea { flex:1; background:var(--input-bg); border:1px solid var(--card-border); border-radius:30px; padding:12px 18px; font-size:16px; color:var(--text-primary); outline:none; resize:none; min-height:44px; max-height:120px; line-height:1.4; overflow-y:auto; }
        .chat-input-area button { width:48px; height:48px; border-radius:30px; padding:0; font-size:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .attach-btn { background:var(--icon-bg); border:1px solid var(--card-border); color:var(--accent); }
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background:var(--panel-bg); backdrop-filter:blur(20px); border-radius:36px; padding:24px; max-width:90%; width:400px; border:1px solid var(--container-border); position:relative; }
        .modal-close-btn { position:absolute; top:12px; right:12px; background:var(--icon-bg); border:1px solid var(--card-border); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:16px; cursor:pointer; }
        .modal-buttons { display:flex; gap:12px; margin-top:20px; }
        .auth-container { flex:1; display:flex; flex-direction:column; justify-content:center; padding:16px; }
        .profile-avatar { display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
        .avatar-img { width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid var(--accent); background:var(--icon-bg); cursor:pointer; }
        .avatar-upload-btn { background:var(--icon-bg); border:1px solid var(--card-border); border-radius:30px; width:40px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--accent); cursor:pointer; }
        .avatar-delete-btn { background:#ff6b6b; border:none; border-radius:30px; width:40px; height:40px; font-size:18px; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .profile-actions { display:flex; gap:8px; margin-top:8px; }
        #media-view-modal .modal-content { background:transparent; backdrop-filter:none; box-shadow:none; display:flex; justify-content:center; align-items:center; padding:0; width:100%; height:100%; max-width:100%; max-height:100%; border-radius:0; }
        #media-view-modal img, #media-view-modal video { max-width:90vw; max-height:80vh; border-radius:16px; object-fit:contain; cursor:default; }
        .loading-spinner { text-align:center; padding:20px; color:var(--text-muted); }
        .participant-list { list-style:none; max-height:300px; overflow-y:auto; margin-top:16px; }
        .participant-list li { padding:8px 0; border-bottom:1px solid var(--card-border); color:var(--text-primary); }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- Экран входа -->
    <div class="screen" id="auth-screen">
        <div class="page-header"><h2>ChatX</h2><div></div></div>
        <div class="auth-container">
            <div class="panel">
                <div class="input-group"><input type="text" id="auth-username" placeholder="Имя пользователя"></div>
                <div class="input-group"><input type="password" id="auth-password" placeholder="Пароль"></div>
                <div class="flex-col">
                    <button class="btn btn-primary" id="auth-login">Войти</button>
                    <button class="btn" id="auth-register">Зарегистрироваться</button>
                </div>
                <div id="auth-status" class="status"></div>
            </div>
        </div>
    </div>

    <!-- Главное приложение -->
    <div class="screen screen-hidden" id="main-screen">
        <div class="screen-container">
            <!-- Профиль -->
            <div class="inner-screen" id="profile-screen">
                <div class="page-header">
                    <div class="chat-header-left" style="gap:8px;">
                        <span style="color:var(--text-primary); font-size:24px; font-weight:600;" id="profile-username-header"></span>
                        <button class="edit-btn" id="edit-username-btn" style="background:var(--icon-bg); width:40px; height:40px; border-radius:30px; border:1px solid var(--card-border); color:var(--accent); font-size:18px; cursor:pointer;"><i class="fas fa-pencil-alt"></i></button>
                    </div>
                    <div class="theme-toggle" id="profile-theme-toggle"><i class="fas fa-sun"></i></div>
                </div>
                <div class="page-content">
                    <div class="panel">
                        <div class="profile-avatar">
                            <img id="profile-avatar-img" class="avatar-img" src="" alt="avatar" onclick="window.openMedia(this.src)">
                            <div class="profile-actions">
                                <button class="avatar-upload-btn" id="upload-avatar-btn"><i class="fas fa-camera"></i></button>
                                <button class="avatar-delete-btn" id="delete-avatar-btn"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <button class="btn" id="change-password-btn" style="margin-bottom:8px;">Изменить пароль</button>
                        <div class="flex-row" style="justify-content:space-between; margin-top:16px;">
                            <button class="btn" id="logout-btn" style="width:45%;">Выйти</button>
                            <button class="btn" id="delete-account-btn" style="width:45%; background:#ff6b6b; color:white;">Удалить</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Паблик -->
            <div class="inner-screen inner-screen-hidden" id="public-screen">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <div class="back-btn" id="public-back"><i class="fas fa-arrow-left"></i></div>
                        <h2>Паблик</h2>
                    </div>
                    <div class="participant-count" id="public-participant-count" title="Участники онлайн">0</div>
                </div>
                <div class="chat-messages" id="public-messages"></div>
                <div class="chat-input-area">
                    <textarea id="public-input" rows="1" placeholder="Написать..."></textarea>
                    <button class="btn attach-btn" id="public-attach"><i class="fas fa-paperclip"></i></button>
                    <button class="btn btn-primary" id="public-send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- Сейвы -->
            <div class="inner-screen inner-screen-hidden" id="local-screen">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <div class="back-btn" id="local-back"><i class="fas fa-arrow-left"></i></div>
                        <h2>Сейвы</h2>
                    </div>
                    <!-- Кнопка участников удалена -->
                    <div></div>
                </div>
                <div class="chat-messages" id="local-messages"></div>
                <div class="chat-input-area">
                    <textarea id="local-input" rows="1" placeholder="Заметка..."></textarea>
                    <button class="btn attach-btn" id="local-attach"><i class="fas fa-paperclip"></i></button>
                    <button class="btn btn-primary" id="local-send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav" id="bottom-nav">
            <div class="nav-item" data-screen="profile"><i class="fas fa-user"></i><span>Профиль</span></div>
            <div class="nav-item" data-screen="public"><i class="fas fa-globe"></i><span>Паблик</span></div>
            <div class="nav-item" data-screen="local"><i class="fas fa-save"></i><span>Сейвы</span></div>
        </div>
    </div>

    <!-- Модальные окна -->
    <div id="password-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="this.closest('.modal').style.display='none'"><i class="fas fa-times"></i></button>
            <h3 style="color:var(--text-primary); margin-bottom:16px;" id="modal-title">Введите пароль</h3>
            <input type="password" id="modal-password" placeholder="Пароль" style="width:100%; padding:12px; border-radius:30px; border:1px solid var(--card-border); background:var(--input-bg); color:var(--text-primary);">
            <div id="modal-error" style="color:#ff6b6b; margin-top:8px; font-size:14px;"></div>
            <div class="modal-buttons">
                <button class="btn" id="modal-cancel">Отмена</button>
                <button class="btn btn-primary" id="modal-confirm">Подтвердить</button>
            </div>
        </div>
    </div>
    <div id="confirm-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="this.closest('.modal').style.display='none'"><i class="fas fa-times"></i></button>
            <h3 style="color:var(--text-primary); margin-bottom:16px;" id="confirm-title">Вы уверены?</h3>
            <div class="modal-buttons">
                <button class="btn" id="confirm-no">Нет</button>
                <button class="btn btn-primary" id="confirm-yes">Да</button>
            </div>
        </div>
    </div>
    <div id="change-password-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="this.closest('.modal').style.display='none'"><i class="fas fa-times"></i></button>
            <h3 style="color:var(--text-primary); margin-bottom:16px;">Смена пароля</h3>
            <input type="password" id="old-password" placeholder="Старый пароль" style="width:100%; padding:12px; border-radius:30px; border:1px solid var(--card-border); background:var(--input-bg); color:var(--text-primary); margin-bottom:12px;">
            <input type="password" id="new-password" placeholder="Новый пароль" style="width:100%; padding:12px; border-radius:30px; border:1px solid var(--card-border); background:var(--input-bg); color:var(--text-primary); margin-bottom:12px;">
            <div id="change-password-error" style="color:#ff6b6b; margin-top:8px; font-size:14px;"></div>
            <div class="modal-buttons">
                <button class="btn" id="change-password-cancel">Отмена</button>
                <button class="btn btn-primary" id="change-password-confirm">Сменить</button>
            </div>
        </div>
    </div>
    <div id="media-view-modal" class="modal" style="display:none;">
        <div class="modal-content" onclick="event.stopPropagation();">
            <div id="media-view-container"></div>
        </div>
    </div>
    <div id="participants-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="this.closest('.modal').style.display='none'"><i class="fas fa-times"></i></button>
            <h3 style="color:var(--text-primary); margin-bottom:16px;">Участники онлайн</h3>
            <div id="participants-loading" class="loading-spinner" style="display:none;">Загрузка...</div>
            <ul id="participants-list" class="participant-list"></ul>
            <div class="modal-buttons">
                <button class="btn" onclick="this.closest('.modal').style.display='none'">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const API_BASE = '';
    let currentUser = null;
    let currentUserAvatar = null;
    let currentRoom = null;
    let socket = null;
    let localMessages = [];
    let publicMessagesCache = [];

    let currentTheme = localStorage.getItem('chatxTheme') || 'system';
    function applyTheme() {
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isDark = currentTheme === 'dark' || (currentTheme === 'system' && systemDark);
        document.body.classList.toggle('dark', isDark);
        const icon = document.querySelector('#profile-theme-toggle i');
        if (icon) icon.className = currentTheme === 'light' ? 'fas fa-sun' : (currentTheme === 'dark' ? 'fas fa-moon' : 'fas fa-circle-half-stroke');
        document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#000000' : '#4a3aff');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', isDark ? 'black-translucent' : 'default');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    applyTheme();

    const authScreen = document.getElementById('auth-screen');
    const mainScreen = document.getElementById('main-screen');
    const profileScreen = document.getElementById('profile-screen');
    const publicScreen = document.getElementById('public-screen');
    const localScreen = document.getElementById('local-screen');
    const navItems = document.querySelectorAll('.nav-item');
    const bottomNav = document.getElementById('bottom-nav');
    const profileUsernameHeader = document.getElementById('profile-username-header');
    const profileAvatarImg = document.getElementById('profile-avatar-img');
    const authUsername = document.getElementById('auth-username');
    const authPassword = document.getElementById('auth-password');
    const authStatus = document.getElementById('auth-status');
    const authLogin = document.getElementById('auth-login');
    const authRegister = document.getElementById('auth-register');
    const publicMessagesEl = document.getElementById('public-messages');
    const publicInput = document.getElementById('public-input');
    const publicSend = document.getElementById('public-send');
    const publicAttach = document.getElementById('public-attach');
    const publicParticipantCount = document.getElementById('public-participant-count');
    const publicBack = document.getElementById('public-back');
    const localMessagesEl = document.getElementById('local-messages');
    const localInput = document.getElementById('local-input');
    const localSend = document.getElementById('local-send');
    const localAttach = document.getElementById('local-attach');
    const localBack = document.getElementById('local-back');
    const passwordModal = document.getElementById('password-modal');
    const confirmModal = document.getElementById('confirm-modal');
    const changePasswordModal = document.getElementById('change-password-modal');
    const mediaViewModal = document.getElementById('media-view-modal');
    const mediaViewContainer = document.getElementById('media-view-container');
    const participantsModal = document.getElementById('participants-modal');
    const participantsList = document.getElementById('participants-list');
    const participantsLoading = document.getElementById('participants-loading');
    const profileThemeToggle = document.getElementById('profile-theme-toggle');
    const modalTitle = document.getElementById('modal-title');
    const modalPassword = document.getElementById('modal-password');
    const modalError = document.getElementById('modal-error');
    const modalCancel = document.getElementById('modal-cancel');
    const modalConfirm = document.getElementById('modal-confirm');
    const confirmNo = document.getElementById('confirm-no');
    const confirmYes = document.getElementById('confirm-yes');
    const oldPassword = document.getElementById('old-password');
    const newPassword = document.getElementById('new-password');
    const changePasswordError = document.getElementById('change-password-error');
    const changePasswordCancel = document.getElementById('change-password-cancel');
    const changePasswordConfirm = document.getElementById('change-password-confirm');
    const deleteAvatarBtn = document.getElementById('delete-avatar-btn');
    const editUsernameBtn = document.getElementById('edit-username-btn');

    profileThemeToggle.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : (currentTheme === 'dark' ? 'system' : 'light');
        localStorage.setItem('chatxTheme', currentTheme);
        applyTheme();
    });

    // Закрытие медиа по клику на фон
    mediaViewModal.addEventListener('click', function(e) {
        if (e.target === mediaViewModal) {
            mediaViewModal.style.display = 'none';
        }
    });

    function showInnerScreen(screenId) {
        profileScreen.classList.add('inner-screen-hidden');
        publicScreen.classList.add('inner-screen-hidden');
        localScreen.classList.add('inner-screen-hidden');
        document.getElementById(screenId).classList.remove('inner-screen-hidden');
        const targetNav = screenId === 'profile-screen' ? 'profile' : (screenId === 'public-screen' ? 'public' : 'local');
        navItems.forEach(item => item.classList.toggle('active', item.dataset.screen === targetNav));
        bottomNav.style.display = (screenId === 'public-screen' || screenId === 'local-screen') ? 'none' : 'flex';
    }
    navItems.forEach(item => {
        item.addEventListener('click', () => {
            const screen = item.dataset.screen;
            if (screen === 'public') {
                if (currentRoom) leaveRoom(currentRoom);
                joinRoom('public');
                showInnerScreen('public-screen');
            } else if (screen === 'local') {
                if (currentRoom) leaveRoom(currentRoom);
                joinRoom('_localstorage');
                showInnerScreen('local-screen');
            } else {
                showInnerScreen('profile-screen');
            }
        });
    });

    async function login(username, password) {
        try {
            const res = await fetch(API_BASE + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка');
            currentUser = { username };
            currentUserAvatar = data.avatar;
            localStorage.setItem('chatxUser', JSON.stringify(currentUser));
            if (currentUserAvatar) profileAvatarImg.src = currentUserAvatar;
            authScreen.classList.add('screen-hidden');
            mainScreen.classList.remove('screen-hidden');
            profileUsernameHeader.textContent = username;
            connectSocket();
            showInnerScreen('profile-screen');
        } catch (err) { authStatus.textContent = err.message; }
    }
    async function register(username, password) {
        try {
            const res = await fetch(API_BASE + '/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка');
            authStatus.textContent = 'Регистрация успешна, вход...';
            await login(username, password);
        } catch (err) { authStatus.textContent = err.message; }
    }
    authLogin.addEventListener('click', () => {
        const u = authUsername.value.trim(), p = authPassword.value.trim();
        if (u && p) login(u, p); else authStatus.textContent = 'Введите имя и пароль';
    });
    authRegister.addEventListener('click', () => {
        const u = authUsername.value.trim(), p = authPassword.value.trim();
        if (u && p) register(u, p); else authStatus.textContent = 'Введите имя и пароль';
    });

    const savedUser = localStorage.getItem('chatxUser');
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        fetch(API_BASE + '/api/avatar/' + currentUser.username).then(r => r.json()).then(data => {
            if (data.avatar) { currentUserAvatar = data.avatar; profileAvatarImg.src = data.avatar; }
        }).catch(() => {});
        authScreen.classList.add('screen-hidden');
        mainScreen.classList.remove('screen-hidden');
        profileUsernameHeader.textContent = currentUser.username;
        connectSocket();
        showInnerScreen('profile-screen');
    } else {
        authScreen.classList.remove('screen-hidden');
        mainScreen.classList.add('screen-hidden');
    }

    document.getElementById('upload-avatar-btn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                fetch(API_BASE + '/api/upload-avatar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser.username, avatar: event.target.result }) })
                .then(r => r.json()).then(data => {
                    if (data.success) { currentUserAvatar = event.target.result; profileAvatarImg.src = event.target.result; alert('Аватар обновлён'); }
                    else alert('Ошибка');
                });
            };
            reader.readAsDataURL(file);
        };
        input.click();
    });
    deleteAvatarBtn.addEventListener('click', async () => {
        if (confirm('Удалить аватар?')) {
            await fetch(API_BASE + '/api/upload-avatar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser.username, avatar: '' }) });
            currentUserAvatar = ''; profileAvatarImg.src = ''; alert('Аватар удалён');
        }
    });

    document.getElementById('change-password-btn').addEventListener('click', () => {
        changePasswordModal.style.display = 'flex'; oldPassword.value = ''; newPassword.value = ''; changePasswordError.textContent = '';
    });
    changePasswordCancel.addEventListener('click', () => changePasswordModal.style.display = 'none');
    changePasswordConfirm.addEventListener('click', async () => {
        const old = oldPassword.value.trim(), newPwd = newPassword.value.trim();
        if (!old || !newPwd) { changePasswordError.textContent = 'Заполните поля'; return; }
        try {
            const res = await fetch(API_BASE + '/api/change-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser.username, oldPassword: old, newPassword: newPwd }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            changePasswordModal.style.display = 'none'; alert('Пароль изменён');
        } catch (err) { changePasswordError.textContent = err.message; }
    });

    document.getElementById('delete-account-btn').addEventListener('click', () => {
        modalTitle.textContent = 'Удалить аккаунт? Введите пароль'; modalPassword.value = ''; modalError.textContent = ''; passwordModal.style.display = 'flex';
        modalConfirm.onclick = async () => {
            const p = modalPassword.value.trim(); if (!p) return;
            try {
                const r = await fetch(API_BASE + '/api/delete-account', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser.username, password: p }) });
                if (!r.ok) { const e = await r.json(); modalError.textContent = e.error || 'Неверный пароль'; return; }
                localStorage.removeItem('chatxUser'); currentUser = null; if (socket) socket.close();
                passwordModal.style.display = 'none'; mainScreen.classList.add('screen-hidden'); authScreen.classList.remove('screen-hidden');
            } catch (e) { modalError.textContent = 'Ошибка сервера'; }
        };
        modalCancel.onclick = () => passwordModal.style.display = 'none';
    });
    document.getElementById('logout-btn').addEventListener('click', () => {
        confirmModal.style.display = 'flex'; document.getElementById('confirm-title').textContent = 'Выйти?';
        confirmYes.onclick = () => { localStorage.removeItem('chatxUser'); currentUser = null; if (socket) socket.close(); confirmModal.style.display = 'none'; mainScreen.classList.add('screen-hidden'); authScreen.classList.remove('screen-hidden'); };
        confirmNo.onclick = () => confirmModal.style.display = 'none';
    });

    editUsernameBtn.addEventListener('click', () => {
        const newNick = prompt('Новый ник:', currentUser?.username || '');
        if (newNick && newNick.trim()) {
            currentUser.username = newNick.trim();
            localStorage.setItem('chatxUser', JSON.stringify(currentUser));
            profileUsernameHeader.textContent = currentUser.username;
        }
    });

    function loadLocalMessages() {
        try { localMessages = JSON.parse(localStorage.getItem('chatx_local_room') || '[]'); } catch (e) { localMessages = []; }
    }
    function saveLocalMessages() { localStorage.setItem('chatx_local_room', JSON.stringify(localMessages)); }
    loadLocalMessages();

    function connectSocket() {
        if (socket) socket.close();
        socket = io({ reconnectionAttempts: 5, timeout: 10000 });
        socket.on('connect', () => console.log('✅ Socket connected'));
        socket.on('roomError', d => alert(d.message));
        socket.on('roomJoined', d => {
            publicMessagesCache = d.messages;
            if (currentRoom === 'public') {
                displayPublicMessages();
                publicParticipantCount.textContent = d.userCount;
            }
        });
        socket.on('newMessage', d => {
            if (d.roomId === 'public') {
                publicMessagesCache.push(d);
                if (currentRoom === 'public') addPublicMessageToChat(d);
            }
        });
        socket.on('userCount', d => { if (currentRoom === 'public') publicParticipantCount.textContent = d.count; });
    }

    function joinRoom(id) {
        if (id === '_localstorage') {
            currentRoom = '_localstorage';
            displayLocalMessages();
            showInnerScreen('local-screen');
            return;
        }
        if (!socket) return;
        socket.emit('joinRoom', { roomId: 'public', username: currentUser.username });
        currentRoom = 'public';
        if (publicMessagesCache.length) displayPublicMessages();
        else publicMessagesEl.innerHTML = '';
    }
    function leaveRoom(id) {
        if (id === 'public' && socket) socket.emit('leaveRoom', { roomId: 'public' });
        if (id === currentRoom) currentRoom = null;
    }
    function sendMessage(id, text, isMedia) {
        if (id === '_localstorage') {
            const msg = { id: 'local_' + Date.now(), roomId: '_localstorage', sender: currentUser?.username || 'local', text, timestamp: new Date().toISOString() };
            localMessages.push(msg); saveLocalMessages(); addLocalMessageToChat(msg); return;
        }
        if (socket && currentUser) socket.emit('sendMessage', { roomId: 'public', sender: currentUser.username, text });
    }

    function formatDateHeader(ts) { return new Date(ts).toLocaleDateString('ru-RU', { year:'numeric', month:'long', day:'numeric' }); }
    function escapeHtml(t) { return t.replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m])); }
    function renderMessageBubble(msg, own) {
        const time = new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
        const isMedia = msg.text?.startsWith('data:');
        let content = '';
        if (isMedia) {
            if (msg.text.startsWith('data:image')) content = `<img src="${msg.text}" class="message-media" onclick="window.openMedia('${msg.text}')">`;
            else if (msg.text.startsWith('data:video')) content = `<video controls class="message-media" src="${msg.text}"></video>`;
            else if (msg.text.startsWith('data:audio')) content = `<audio controls src="${msg.text}"></audio>`;
            content += `<button class="message-download-btn" onclick="event.stopPropagation(); window.downloadMedia('${msg.text}')"><i class="fas fa-download"></i></button>`;
        } else {
            content = `<div class="message-text">${escapeHtml(msg.text)}</div>`;
        }
        return `<div class="message-bubble ${own ? 'message-bubble-own' : ''}">
            ${own ? '' : `<div class="message-sender">${escapeHtml(msg.sender)}</div>`}
            ${content}<div class="message-time">${time}</div></div>`;
    }

    function addMessageWithDate(container, msg, prevDate) {
        const msgDate = new Date(msg.timestamp).toDateString();
        if (prevDate !== msgDate) {
            const sep = document.createElement('div'); sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatDateHeader(msg.timestamp)}</span>`;
            container.appendChild(sep);
        }
        const own = msg.sender === currentUser?.username;
        const div = document.createElement('div');
        div.className = `message ${own ? 'message-own' : ''}`;
        div.setAttribute('data-msg-id', msg.id);
        if (!own && msg.avatar) {
            const av = document.createElement('img'); av.className = 'message-avatar'; av.src = msg.avatar;
            av.onclick = () => window.openMedia(msg.avatar);
            div.appendChild(av);
        }
        const content = document.createElement('div'); content.className = 'message-content';
        content.innerHTML = renderMessageBubble(msg, own);
        div.appendChild(content);
        container.appendChild(div);
        return msgDate;
    }

    function displayPublicMessages() {
        publicMessagesEl.innerHTML = '';
        let last = null;
        publicMessagesCache.forEach(m => { last = addMessageWithDate(publicMessagesEl, m, last); });
        publicMessagesEl.scrollTop = publicMessagesEl.scrollHeight;
    }
    function addPublicMessageToChat(m) {
        if (publicMessagesEl.querySelector(`[data-msg-id="${m.id}"]`)) return;
        displayPublicMessages();
    }
    function displayLocalMessages() {
        localMessagesEl.innerHTML = '';
        let last = null;
        localMessages.forEach(m => { last = addMessageWithDate(localMessagesEl, m, last); });
        localMessagesEl.scrollTop = localMessagesEl.scrollHeight;
    }
    function addLocalMessageToChat(m) { displayLocalMessages(); }

    publicSend.addEventListener('click', () => {
        const t = publicInput.value.trim();
        if (t && currentRoom === 'public') { sendMessage('public', t); publicInput.value = ''; autoResize(publicInput); }
    });
    publicInput.addEventListener('keypress', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); publicSend.click(); } });
    localSend.addEventListener('click', () => {
        const t = localInput.value.trim();
        if (t) { sendMessage('_localstorage', t); localInput.value = ''; autoResize(localInput); }
    });
    localInput.addEventListener('keypress', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); localSend.click(); } });

    function attachMediaHandler(id) {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*,video/*,audio/*';
        inp.onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => sendMessage(id, ev.target.result, true); r.readAsDataURL(f); };
        inp.click();
    }
    publicAttach.addEventListener('click', () => attachMediaHandler('public'));
    localAttach.addEventListener('click', () => attachMediaHandler('_localstorage'));

    publicBack.addEventListener('click', () => { leaveRoom('public'); showInnerScreen('profile-screen'); });
    localBack.addEventListener('click', () => { leaveRoom('_localstorage'); showInnerScreen('profile-screen'); });

    window.openMedia = (src) => {
        mediaViewContainer.innerHTML = src.startsWith('data:video') ? `<video controls src="${src}"></video>` : `<img src="${src}">`;
        mediaViewModal.style.display = 'flex';
    };
    window.downloadMedia = (src) => { const a = document.createElement('a'); a.href = src; a.download = 'media_' + Date.now(); document.body.appendChild(a); a.click(); document.body.removeChild(a); };

    publicParticipantCount.addEventListener('click', async () => {
        participantsModal.style.display = 'flex';
        participantsList.innerHTML = '';
        participantsLoading.style.display = 'block';
        try {
            const res = await fetch(API_BASE + '/api/rooms/participants/public');
            const users = await res.json();
            participantsList.innerHTML = users.map(u => `<li>${escapeHtml(u)}</li>`).join('');
        } catch (e) {
            participantsList.innerHTML = '<li style="color:#ff6b6b;">Ошибка загрузки</li>';
        } finally {
            participantsLoading.style.display = 'none';
        }
    });

    function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; ta.style.overflowY = ta.scrollHeight > 120 ? 'auto' : 'hidden'; }
    document.querySelectorAll('textarea').forEach(ta => ta.addEventListener('input', () => autoResize(ta)));

    if (Notification.permission !== 'granted' && Notification.permission !== 'denied') Notification.requestPermission();
})();
</script>
</body>
</html>
