<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatX</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChatX">
    <meta name="theme-color" id="theme-color-meta" content="#000000">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
        html, body { width:100%; height:100vh; overflow:hidden; background: linear-gradient(145deg, #e9e9f0, #dadde8); }
        body.dark { background: linear-gradient(145deg, #000000, #121212); }
        body {
            --bg-gradient-start:#e9e9f0; --bg-gradient-end:#dadde8;
            --container-bg:rgba(240,240,245,0.7); --container-border:rgba(255,255,255,0.5);
            --text-primary:#1a1a2e; --text-secondary:#2c3e50; --text-muted:#6b6b80;
            --accent:#4a3aff; --accent-light:#7a6aff;
            --card-bg:rgba(255,255,255,0.6); --card-border:rgba(255,255,255,0.6);
            --shadow:0 25px 50px -12px rgba(0,0,0,0.2); --icon-bg:white;
            --panel-bg:rgba(255,255,255,0.7); --input-bg:rgba(255,255,255,0.5);
            --chat-own-bg:var(--accent); --chat-other-bg:#e0e0f0;
            --chat-own-text:white; --chat-other-text:#1a1a2e;
            transition: background 0.2s, color 0.2s;
        }
        body.dark {
            --bg-gradient-start:#000000; --bg-gradient-end:#121212;
            --container-bg:rgba(0,0,0,0.8); --container-border:rgba(255,255,255,0.15);
            --text-primary:#f0f0ff; --text-secondary:#ecf0f1; --text-muted:#8a8aa0;
            --accent:#6d5fff; --accent-light:#9a8cff;
            --card-bg:rgba(20,20,30,0.7); --card-border:rgba(255,255,255,0.1);
            --shadow:0 25px 50px -12px rgba(0,0,0,0.6); --icon-bg:#1e1e2a;
            --panel-bg:rgba(0,0,0,0.8); --input-bg:rgba(20,20,30,0.6);
            --chat-other-bg:#2a2a3a; --chat-other-text:#ffffff;
        }
        .app-container { width:100%; height:100vh; display:flex; flex-direction:column; background:inherit; }
        #auth-screen { position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; background:inherit; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:16px; }
        #auth-screen.hidden { display:none; }
        .auth-panel { background:var(--panel-bg); backdrop-filter:blur(10px); border-radius:36px; padding:24px 20px; border:1px solid var(--container-border); box-shadow:var(--shadow); width:100%; max-width:360px; }
        .input-group { display:flex; gap:8px; margin-bottom:12px; }
        .input-group input { flex:1; background:var(--input-bg); border:1px solid var(--card-border); border-radius:40px; padding:14px 18px; font-size:16px; color:var(--text-primary); outline:none; }
        .btn { background:var(--icon-bg); border:1px solid var(--card-border); border-radius:40px; padding:14px 24px; font-size:16px; font-weight:600; color:var(--accent); cursor:pointer; width:100%; text-align:center; transition: transform 0.15s ease; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background:var(--accent); color:white; border:none; }
        .status { text-align:center; color:var(--text-muted); margin:8px 0; font-size:14px; }
        .flex-col { display:flex; flex-direction:column; gap:12px; }
        #main-screen { flex:1; display:flex; flex-direction:column; background:transparent; overflow:hidden; }
        .audio-panel { background:var(--panel-bg); backdrop-filter:blur(10px); border-bottom:1px solid var(--container-border); padding:8px 16px; display:none; align-items:center; gap:8px; flex-shrink:0; position:relative; }
        .audio-panel.active { display:flex; }
        .audio-panel .play-btn { width:36px; height:36px; border-radius:50%; background:var(--accent); color:white; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; transition: transform 0.15s ease; }
        .audio-panel .play-btn:active { transform: scale(0.9); }
        .audio-panel .title { flex:1; font-size:14px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .audio-panel .download-btn, .audio-panel .close-btn { background:transparent; border:none; color:var(--text-muted); font-size:20px; cursor:pointer; padding:4px; transition: transform 0.15s ease; }
        .audio-panel .download-btn:active, .audio-panel .close-btn:active { transform: scale(0.9); }
        .audio-panel .progress { position:absolute; bottom:0; left:0; height:3px; background:var(--accent); width:0; }
        .chat-header { display:flex; align-items:center; justify-content:space-between; padding:max(env(safe-area-inset-top),12px) 16px 12px 16px; border-bottom:1px solid var(--container-border); background:var(--container-bg); backdrop-filter:blur(20px); flex-shrink:0; }
        .chat-header-left { display:flex; align-items:center; gap:12px; }
        .profile-btn, .participant-count { margin-top:8px; transition: transform 0.15s ease; }
        .profile-btn:active, .participant-count:active { transform: scale(0.92); }
        .profile-btn { background:var(--icon-bg); width:40px; height:40px; border-radius:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--container-border); color:var(--accent); font-size:20px; }
        .participant-count { background:var(--icon-bg); border-radius:30px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:var(--accent); border:1px solid var(--card-border); cursor:pointer; }
        .typing-indicator { font-size:13px; color:var(--text-muted); padding:4px 16px; background:var(--panel-bg); border-top:1px solid var(--container-border); display:none; flex-shrink:0; }
        .typing-indicator.active { display:block; }
        .chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:4px; -webkit-overflow-scrolling:touch; }
        .chat-input-area { display:flex; align-items:flex-end; gap:8px; padding:8px 16px 12px 16px; border-top:1px solid var(--container-border); background:var(--panel-bg); backdrop-filter:blur(10px); flex-shrink:0; }
        .chat-input-area textarea { flex:1; background:var(--input-bg); border:1px solid var(--card-border); border-radius:30px; padding:12px 18px; font-size:16px; color:var(--text-primary); outline:none; resize:none; min-height:44px; max-height:120px; line-height:1.4; overflow-y:auto; }
        .chat-input-area button { width:48px; height:48px; border-radius:30px; padding:0; font-size:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition: transform 0.15s ease; }
        .chat-input-area button:active { transform: scale(0.92); }
        .attach-btn { background:var(--icon-bg); border:1px solid var(--card-border); color:var(--accent); }
        #voice-btn { background:var(--icon-bg); border:1px solid var(--card-border); color:var(--accent); font-size:22px; }
        #public-send { background:var(--accent); color:white; border:none; overflow:hidden; position:relative; }
        #public-send .cooldown-bar { position:absolute; bottom:0; left:0; height:100%; width:0; background:rgba(255,255,255,0.3); transition:width 3s linear; pointer-events:none; }
        #public-send.disabled { pointer-events:none; opacity:0.7; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
        .recording-active { animation: pulse 1s infinite; }
        .message { display:flex; margin-bottom:4px; align-items:flex-start; gap:8px; }
        .message-own { justify-content:flex-end; }
        .message-avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; cursor:pointer; color:#fff; background:#ccc; }
        .message-own .message-avatar { display:none; }
        .message-content { max-width:calc(80% - 48px); display:flex; flex-direction:column; }
        .message-bubble { background:var(--chat-other-bg); border-radius:24px; padding:10px 16px; border:1px solid var(--card-border); word-break:break-word; color:var(--chat-other-text); position:relative; min-width:80px; }
        .message-bubble-own { background:var(--chat-own-bg); color:var(--chat-own-text); border-color:var(--accent-light); }
        .message-sender { font-size:13px; font-weight:600; margin-bottom:4px; color:var(--accent); }
        .message-text { font-size:15px; line-height:1.4; }
        .message-time { font-size:11px; opacity:0.7; margin-top:4px; text-align:right; }
        .message-media { max-width:100%; border-radius:16px; cursor:pointer; margin-bottom:30px; display:block; }
        .media-placeholder { width:200px; height:150px; background:var(--input-bg); border-radius:16px; display:flex; align-items:center; justify-content:center; margin-bottom:30px; cursor:pointer; color:var(--text-muted); font-size:14px; flex-direction:column; gap:8px; }
        .media-placeholder i { font-size:32px; }
        .custom-audio { display:flex; align-items:center; gap:8px; margin-bottom:28px; }
        .custom-audio .voice-btn { width:36px; height:36px; border-radius:50%; background:var(--accent); color:white; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; transition: transform 0.15s ease; }
        .custom-audio .voice-btn:active { transform: scale(0.9); }
        .message-own .custom-audio .voice-btn { background:white; color:var(--accent); }
        .message-download-btn { position:absolute; bottom:4px; left:8px; background:rgba(0,0,0,0.5); color:white; border-radius:20px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; font-size:16px; z-index:2; }
        .date-separator { display:flex; justify-content:center; margin:12px 0; }
        .date-separator span { background:var(--panel-bg); backdrop-filter:blur(10px); padding:4px 16px; border-radius:30px; font-size:13px; color:var(--text-muted); border:1px solid var(--container-border); }
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background:var(--panel-bg); backdrop-filter:blur(20px); border-radius:36px; padding:24px; max-width:90%; width:400px; border:1px solid var(--container-border); position:relative; }
        .modal-buttons { display:flex; gap:12px; margin-top:20px; }
        .profile-avatar { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
        .avatar-circle { width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; color:#fff; background:#ccc; flex-shrink:0; }
        .horizontal-scroll { display:flex; gap:8px; overflow-x:auto; padding:8px 0; -webkit-overflow-scrolling:touch; }
        .horizontal-scroll::-webkit-scrollbar { display:none; }
        .color-option, .emoji-option { flex-shrink:0; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid transparent; font-size:24px; }
        .color-option.selected, .emoji-option.selected { border-color:var(--accent); }
        #media-view-modal .modal-content { background:transparent; backdrop-filter:none; box-shadow:none; display:flex; justify-content:center; align-items:center; padding:0; width:100%; height:100%; max-width:100%; max-height:100%; border-radius:0; position:relative; }
        #media-view-modal img, #media-view-modal video { max-width:90vw; max-height:80vh; border-radius:16px; object-fit:contain; cursor:default; }
        #media-view-close-btn { position:absolute; top:max(env(safe-area-inset-top) + 20px, 60px); right:20px; background:rgba(0,0,0,0.6); color:white; border:none; border-radius:50%; width:44px; height:44px; font-size:24px; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center; transition: transform 0.15s ease; }
        #media-view-close-btn:active { transform: scale(0.9); }
        .loading-spinner { text-align:center; padding:20px; color:var(--text-muted); }
        .participant-list { list-style:none; max-height:300px; overflow-y:auto; margin-top:16px; }
        .participant-list li { padding:8px 0; border-bottom:1px solid var(--card-border); color:var(--text-primary); }
        .flex-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="auth-screen">
        <div class="auth-panel">
            <div class="input-group"><input type="text" id="auth-username" placeholder="Имя пользователя"></div>
            <div class="input-group"><input type="password" id="auth-password" placeholder="Пароль"></div>
            <div class="flex-col"><button class="btn btn-primary" id="auth-login">Войти</button><button class="btn" id="auth-register">Зарегистрироваться</button></div>
            <div id="auth-status" class="status"></div>
        </div>
    </div>
    <div id="main-screen" style="display:none;">
        <div class="chat-header">
            <div class="chat-header-left"><div class="profile-btn" id="profile-btn"><i class="fas fa-user"></i></div></div>
            <div class="participant-count" id="public-participant-count" title="Участники онлайн">0</div>
        </div>
        <div class="audio-panel" id="audio-panel">
            <button class="play-btn" id="audio-panel-play"><i class="fas fa-play"></i></button>
            <div class="title" id="audio-panel-title"></div>
            <button class="download-btn" id="audio-panel-download" title="Скачать"><i class="fas fa-download"></i></button>
            <button class="close-btn" id="audio-panel-close"><i class="fas fa-times"></i></button>
            <div class="progress" id="audio-panel-progress"></div>
        </div>
        <div class="chat-messages" id="public-messages"></div>
        <div class="typing-indicator" id="typing-indicator"></div>
        <div class="chat-input-area">
            <textarea id="public-input" rows="1" placeholder="Написать..."></textarea>
            <button class="btn" id="voice-btn" title="Голосовое сообщение"><i class="fas fa-microphone"></i></button>
            <button class="btn attach-btn" id="public-attach"><i class="fas fa-paperclip"></i></button>
            <button class="btn btn-primary" id="public-send"><i class="fas fa-paper-plane"></i><div class="cooldown-bar" id="cooldown-bar"></div></button>
        </div>
    </div>
</div>

<div id="profile-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3 style="color:var(--text-primary); margin-bottom:16px;">Профиль</h3>
        <div class="profile-avatar"><div class="avatar-circle" id="profile-avatar-circle"></div><button class="btn" id="change-avatar-btn" style="width:auto; padding:12px 20px;">Изменить</button></div>
        <div style="margin-bottom:20px;"><div style="color:var(--text-primary); font-size:18px; margin-bottom:8px;">Имя пользователя</div><span style="color:var(--accent); font-size:24px; font-weight:600;" id="profile-username-display"></span></div>
        <div style="margin:16px 0;"><div class="flex-row" style="justify-content:space-between;"><span style="color:var(--text-primary);">Тема</span><button class="btn" id="theme-toggle-btn" style="width:auto;">Авто</button></div></div>
        <button class="btn" id="logout-btn" style="margin-top:16px;">Выйти</button>
        <div class="modal-buttons"><button class="btn" id="profile-close-btn">Закрыть</button></div>
    </div>
</div>
<div id="avatar-picker-modal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:95%; width:auto;">
        <h3 style="color:var(--text-primary); margin-bottom:16px;">Изменить аватар</h3>
        <div style="margin-bottom:16px;"><div style="color:var(--text-primary); margin-bottom:8px;">Фон</div><div class="horizontal-scroll" id="color-scroll"></div></div>
        <div style="margin-bottom:16px;"><div style="color:var(--text-primary); margin-bottom:8px;">Эмодзи</div><div class="horizontal-scroll" id="emoji-scroll"></div></div>
        <div class="modal-buttons"><button class="btn" id="avatar-cancel-btn">Отмена</button><button class="btn btn-primary" id="avatar-save-btn">Сохранить</button></div>
    </div>
</div>
<div id="participants-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3 style="color:var(--text-primary); margin-bottom:16px;">Участники онлайн</h3>
        <div id="participants-loading" class="loading-spinner" style="display:none;">Загрузка...</div>
        <ul id="participants-list" class="participant-list"></ul>
        <div class="modal-buttons"><button class="btn" id="participants-close-btn">Закрыть</button></div>
    </div>
</div>
<div id="media-view-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <button id="media-view-close-btn" onclick="document.getElementById('media-view-modal').style.display='none'"><i class="fas fa-times"></i></button>
        <div id="media-view-container"></div>
    </div>
</div>

<script>
(function() {
    const API_BASE = '';
    let currentUser = null, socket = null, publicMessagesCache = [], canSend = true, cooldownTimer;
    let isLoadingMore = false, oldestTimestamp = null;
    const EMOJI_LIST = ['😀','😂','😍','👍','🔥','🎉','💡','❤️','😎','🤔','😢','😡','🥳','😴','🤯','😇','🙃','🤑','🤠','😈'];
    const COLORS = ['#E57373','#F06292','#BA68C8','#9575CD','#7986CB','#64B5F6','#4FC3F7','#4DD0E1','#4DB6AC','#81C784','#AED581','#DCE775','#FFD54F','#FFB74D','#FF8A65','#A1887F','#E0E0E0','#90A4AE'];
    let selectedEmoji = '', selectedColor = '#ccc', currentTheme = localStorage.getItem('chatxTheme') || 'system';
    let currentAudio = null, currentAudioSrc = null, currentAudioBtns = [], currentAudioFills = [];

    // Запись голоса
    let mediaRecorder = null, audioChunks = [], recordingState = 'idle';
    const voiceBtn = document.getElementById('voice-btn');
    const publicSend = document.getElementById('public-send');
    const publicAttach = document.getElementById('public-attach');
    const publicInput = document.getElementById('public-input');

    function updateVoiceButton() {
        const icon = voiceBtn.querySelector('i');
        if (recordingState === 'idle') {
            icon.className = 'fas fa-microphone';
            voiceBtn.classList.remove('recording-active');
        } else if (recordingState === 'recording') {
            icon.className = 'fas fa-pause';
            voiceBtn.classList.add('recording-active');
        } else if (recordingState === 'paused') {
            icon.className = 'fas fa-play';
            voiceBtn.classList.remove('recording-active');
        }
        const disableOthers = (recordingState === 'recording');
        publicSend.disabled = disableOthers;
        publicAttach.disabled = disableOthers;
        publicInput.disabled = disableOthers;
    }

    async function startRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('Ваш браузер не поддерживает запись аудио.');
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
            audioChunks = [];
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.start();
            recordingState = 'recording';
            updateVoiceButton();
        } catch (err) { alert('Ошибка доступа к микрофону: ' + err.message); }
    }

    function pauseRecording() {
        if (mediaRecorder && recordingState === 'recording') {
            mediaRecorder.pause();
            recordingState = 'paused';
            updateVoiceButton();
        }
    }

    function resumeRecording() {
        if (mediaRecorder && recordingState === 'paused') {
            mediaRecorder.resume();
            recordingState = 'recording';
            updateVoiceButton();
        }
    }

    function stopRecordingAndSend() {
        if (!mediaRecorder || recordingState === 'idle') return;
        return new Promise((resolve) => {
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const dataUrl = ev.target.result;
                    const tempId = 'temp_' + Date.now() + Math.random();
                    const optimisticMsg = {
                        id: tempId, _temp: true, _tempId: tempId,
                        roomId: 'public', sender: currentUser.username,
                        avatar_emoji: currentUser.avatar_emoji || '', avatar_color: currentUser.avatar_color || '',
                        text: dataUrl, fileName: 'voice.webm', timestamp: new Date().toISOString()
                    };
                    publicMessagesCache.push(optimisticMsg);
                    appendMessageElement(optimisticMsg, true);
                    document.getElementById('public-messages').scrollTop = document.getElementById('public-messages').scrollHeight;
                    socket.emit('sendMessage', { roomId: 'public', username: currentUser.username, text: dataUrl, fileName: 'voice.webm', _tempId: tempId });
                    canSend = false; publicSend.classList.add('disabled');
                    cooldownBar.style.transition = 'none'; cooldownBar.style.width = '0';
                    requestAnimationFrame(() => { cooldownBar.style.transition = 'width 3s linear'; cooldownBar.style.width = '100%'; });
                    cooldownTimer = setTimeout(() => { canSend = true; publicSend.classList.remove('disabled'); cooldownBar.style.transition = 'none'; cooldownBar.style.width = '0'; }, 3000);
                    resolve();
                };
                reader.readAsDataURL(blob);
            };
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            mediaRecorder = null;
            recordingState = 'idle';
            updateVoiceButton();
        });
    }

    voiceBtn.addEventListener('click', () => {
        if (recordingState === 'idle') startRecording();
        else if (recordingState === 'recording') pauseRecording();
        else if (recordingState === 'paused') resumeRecording();
    });

    publicSend.addEventListener('click', () => {
        if (recordingState === 'paused') { stopRecordingAndSend(); return; }
        sendMessage();
    });

    function applyTheme() {
        const isDark = currentTheme === 'dark' || (currentTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.body.classList.toggle('dark', isDark);
        document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#000000' : '#4a3aff');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    applyTheme();

    const $ = id => document.getElementById(id);
    const authScreen = $('auth-screen'), mainScreen = $('main-screen'),
          authUsername = $('auth-username'), authPassword = $('auth-password'), authStatus = $('auth-status'),
          authLogin = $('auth-login'), authRegister = $('auth-register'),
          publicMessagesEl = $('public-messages'), publicParticipantCount = $('public-participant-count'),
          profileBtn = $('profile-btn'), profileModal = $('profile-modal'), profileAvatarCircle = $('profile-avatar-circle'),
          changeAvatarBtn = $('change-avatar-btn'), avatarPickerModal = $('avatar-picker-modal'), colorScroll = $('color-scroll'),
          emojiScroll = $('emoji-scroll'), avatarCancelBtn = $('avatar-cancel-btn'), avatarSaveBtn = $('avatar-save-btn'),
          profileUsernameDisplay = $('profile-username-display'), themeToggleBtn = $('theme-toggle-btn'), logoutBtn = $('logout-btn'),
          profileCloseBtn = $('profile-close-btn'), participantsModal = $('participants-modal'), participantsList = $('participants-list'),
          participantsLoading = $('participants-loading'), participantsCloseBtn = $('participants-close-btn'),
          mediaViewModal = $('media-view-modal'), mediaViewContainer = $('media-view-container'), cooldownBar = $('cooldown-bar'),
          audioPanel = $('audio-panel'), audioPanelPlay = $('audio-panel-play'), audioPanelTitle = $('audio-panel-title'),
          audioPanelDownload = $('audio-panel-download'), audioPanelClose = $('audio-panel-close'), audioPanelProgress = $('audio-panel-progress'),
          typingIndicator = $('typing-indicator');

    function showMain() { authScreen.classList.add('hidden'); mainScreen.style.display = 'flex'; }
    function showAuth() { authScreen.classList.remove('hidden'); mainScreen.style.display = 'none'; }

    function stopCurrentAudio() {
        if (currentAudio) { currentAudio.pause(); currentAudio.remove(); }
        currentAudio = null; currentAudioSrc = null;
        currentAudioBtns.forEach(btn => btn.innerHTML = '<i class="fas fa-play"></i>');
        currentAudioBtns = []; currentAudioFills.forEach(fill => fill.style.width = '0'); currentAudioFills = [];
        audioPanel.classList.remove('active'); audioPanelProgress.style.width = '0';
    }

    function playAudio(src, name, btns, fills) {
        if (currentAudioSrc === src && currentAudio) {
            if (currentAudio.paused) { currentAudio.play(); setButtonsState(true); }
            else { currentAudio.pause(); setButtonsState(false); }
            return;
        }
        stopCurrentAudio();
        const audio = new Audio(src);
        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100 || 0;
            audioPanelProgress.style.width = pct + '%';
            fills.forEach(fill => fill.style.width = pct + '%');
        });
        audio.addEventListener('ended', () => stopCurrentAudio());
        audio.play();
        currentAudio = audio; currentAudioSrc = src; currentAudioBtns = btns; currentAudioFills = fills;
        setButtonsState(true);
        audioPanelTitle.textContent = name || 'Аудио';
        audioPanel.classList.add('active');
        audioPanelPlay.onclick = () => { if (currentAudio.paused) { currentAudio.play(); setButtonsState(true); } else { currentAudio.pause(); setButtonsState(false); } };
        audioPanelDownload.onclick = () => { if (currentAudioSrc) window.downloadMedia(currentAudioSrc); };
        audioPanelClose.onclick = () => stopCurrentAudio();
    }

    function setButtonsState(playing) {
        const icon = playing ? 'fa-pause' : 'fa-play';
        currentAudioBtns.forEach(btn => btn.innerHTML = `<i class="fas ${icon}"></i>`);
    }

    window.initCustomAudio = function(wrapper) {
        const src = wrapper.dataset.src;
        const name = wrapper.dataset.filename || 'Аудио';
        const playBtn = wrapper.querySelector('.voice-btn');
        playBtn.addEventListener('click', () => {
            const btns = [playBtn, audioPanelPlay];
            const fills = [];
            playAudio(src, name, btns, fills);
        });
    };

    window.loadMediaPlaceholder = function(placeholder) {
        const src = placeholder.dataset.src;
        const isAudio = src.startsWith('data:audio');
        const isImage = src.startsWith('data:image');
        if (isAudio) {
            const fileName = placeholder.dataset.filename || 'Аудио';
            placeholder.innerHTML = `<div class="custom-audio" data-src="${src}" data-filename="${escapeHtml(fileName)}">
                <button class="voice-btn"><i class="fas fa-microphone"></i></button>
            </div>`;
            const audioWrapper = placeholder.querySelector('.custom-audio');
            if (audioWrapper) window.initCustomAudio(audioWrapper);
        } else if (isImage) {
            placeholder.innerHTML = `<img src="${src}" class="message-media" onclick="window.openMedia('${src}')">`;
        }
        placeholder.classList.remove('media-placeholder');
    };

    function populateAvatarPicker() {
        colorScroll.innerHTML = ''; COLORS.forEach(c => { const d = document.createElement('div'); d.className = 'color-option' + (c===selectedColor?' selected':''); d.style.backgroundColor = c; d.onclick = () => { selectedColor = c; updatePicker(); }; colorScroll.appendChild(d); });
        emojiScroll.innerHTML = ''; EMOJI_LIST.forEach(e => { const d = document.createElement('div'); d.className = 'emoji-option' + (e===selectedEmoji?' selected':''); d.textContent = e; d.onclick = () => { selectedEmoji = e; updatePicker(); }; emojiScroll.appendChild(d); });
        function updatePicker() { document.querySelectorAll('.color-option').forEach(el => el.classList.toggle('selected', el.style.backgroundColor === selectedColor)); document.querySelectorAll('.emoji-option').forEach(el => el.classList.toggle('selected', el.textContent === selectedEmoji)); }
    }
    function updateAvatarPreview() { profileAvatarCircle.textContent = selectedEmoji || (currentUser ? currentUser.username[0].toUpperCase() : '?'); profileAvatarCircle.style.backgroundColor = selectedColor; }

    async function login(username, password) {
        try {
            const res = await fetch(API_BASE + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            const data = await res.json(); if (!res.ok) throw new Error(data.error);
            currentUser = { username: data.username, avatar_emoji: data.avatar_emoji || '', avatar_color: data.avatar_color || '' };
            selectedEmoji = currentUser.avatar_emoji; selectedColor = currentUser.avatar_color || '#ccc';
            localStorage.setItem('chatxUser', JSON.stringify(currentUser));
            updateAvatarPreview(); showMain(); profileUsernameDisplay.textContent = currentUser.username;
            connectSocket();
        } catch (err) { authStatus.textContent = err.message; }
    }
    async function register(username, password) {
        try {
            const res = await fetch(API_BASE + '/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            if (!res.ok) throw new Error((await res.json()).error);
            authStatus.textContent = 'Регистрация успешна, вход...';
            await login(username, password);
        } catch (err) { authStatus.textContent = err.message; }
    }
    authLogin.onclick = () => { const u = authUsername.value.trim(), p = authPassword.value.trim(); u && p ? login(u,p) : authStatus.textContent = 'Введите имя и пароль'; };
    authRegister.onclick = () => { const u = authUsername.value.trim(), p = authPassword.value.trim(); u && p ? register(u,p) : authStatus.textContent = 'Введите имя и пароль'; };

    (function restoreSession() {
        const saved = localStorage.getItem('chatxUser');
        if (saved) { currentUser = JSON.parse(saved); selectedEmoji = currentUser.avatar_emoji || ''; selectedColor = currentUser.avatar_color || '#ccc'; updateAvatarPreview(); fetch(API_BASE+'/api/avatar/'+currentUser.username).then(r=>r.json()).then(d=>{ if(d.emoji!==undefined){ currentUser.avatar_emoji=d.emoji||''; currentUser.avatar_color=d.color||''; selectedEmoji=currentUser.avatar_emoji; selectedColor=currentUser.avatar_color||'#ccc'; updateAvatarPreview(); }}).catch(()=>{}); showMain(); profileUsernameDisplay.textContent=currentUser.username; connectSocket(); }
        else showAuth();
    })();

    function connectSocket() {
        if (socket) socket.close();
        socket = io({ reconnectionAttempts: 5, timeout: 10000 });
        socket.on('connect', () => console.log('✅ Socket'));
        socket.on('roomError', d => alert(d.message));
        socket.on('roomJoined', d => {
            publicMessagesCache = d.messages;
            if (d.messages.length > 0) oldestTimestamp = d.messages[0].timestamp;
            else oldestTimestamp = null;
            displayPublicMessages(true);
            publicParticipantCount.textContent = d.userCount;
        });
        socket.on('olderMessages', d => {
            if (d.messages.length > 0) {
                publicMessagesCache = d.messages.concat(publicMessagesCache);
                oldestTimestamp = d.messages[0].timestamp;
                const prevScrollHeight = publicMessagesEl.scrollHeight;
                displayPublicMessages(false);
                publicMessagesEl.scrollTop = publicMessagesEl.scrollHeight - prevScrollHeight;
            }
            isLoadingMore = false;
        });
        socket.on('newMessage', d => {
            const tempIndex = publicMessagesCache.findIndex(m => m._temp && m._tempId === d._tempId);
            if (tempIndex !== -1) {
                publicMessagesCache[tempIndex] = { ...d, _temp: false };
                displayPublicMessages(false);
                if (isScrolledToBottom()) publicMessagesEl.scrollTop = publicMessagesEl.scrollHeight;
            } else {
                publicMessagesCache.push(d);
                appendMessageElement(d, false);
                if (isScrolledToBottom()) publicMessagesEl.scrollTop = publicMessagesEl.scrollHeight;
            }
        });
        socket.on('userCount', d => { publicParticipantCount.textContent = d.count; });
        socket.on('typingUpdate', users => updateTypingIndicator(users));
        socket.emit('joinRoom', { roomId: 'public', username: currentUser.username });

        publicMessagesEl.addEventListener('scroll', () => {
            if (publicMessagesEl.scrollTop === 0 && !isLoadingMore && oldestTimestamp && socket) {
                isLoadingMore = true;
                socket.emit('loadOlderMessages', { roomId: 'public', beforeTimestamp: oldestTimestamp, limit: 20 });
            }
        });
    }

    function isScrolledToBottom() {
        return publicMessagesEl.scrollTop + publicMessagesEl.clientHeight >= publicMessagesEl.scrollHeight - 50;
    }

    function appendMessageElement(msg, isOwnMedia = false) {
        const lastMsg = publicMessagesCache.length >= 2 ? publicMessagesCache[publicMessagesCache.length-2] : null;
        const prevDate = lastMsg ? new Date(lastMsg.timestamp).toDateString() : null;
        const msgDiv = addMessageWithDate(publicMessagesEl, msg, prevDate, isOwnMedia);
        if (msg.sender === currentUser?.username && msg.text?.startsWith('data:audio')) {
            const audioWrapper = msgDiv.querySelector('.custom-audio');
            if (audioWrapper) window.initCustomAudio(audioWrapper);
        }
    }

    publicInput.addEventListener('input', () => {
        if (!socket || !currentUser) return;
        if (publicInput.value.trim().length > 0) socket.emit('typingStart', { roomId: 'public', username: currentUser.username });
        else socket.emit('typingStop', { roomId: 'public', username: currentUser.username });
    });

    function updateTypingIndicator(users) {
        const filtered = users.filter(u => u !== currentUser?.username);
        if (filtered.length === 0) { typingIndicator.classList.remove('active'); typingIndicator.textContent = ''; }
        else {
            typingIndicator.classList.add('active');
            if (filtered.length === 1) typingIndicator.textContent = `${filtered[0]} печатает...`;
            else if (filtered.length === 2) typingIndicator.textContent = `${filtered[0]}, ${filtered[1]} печатают...`;
            else typingIndicator.textContent = `${filtered.length} печатают...`;
        }
    }

    function sendMessage() {
        if (!canSend || !socket || !currentUser) return;
        const text = publicInput.value.trim(); if (!text) return;
        const tempId = 'temp_' + Date.now() + Math.random();
        const optimisticMsg = { id: tempId, _temp: true, _tempId: tempId, roomId: 'public', sender: currentUser.username, avatar_emoji: currentUser.avatar_emoji || '', avatar_color: currentUser.avatar_color || '', text, fileName: '', timestamp: new Date().toISOString() };
        publicMessagesCache.push(optimisticMsg);
        appendMessageElement(optimisticMsg, true);
        publicMessagesEl.scrollTop = publicMessagesEl.scrollHeight;
        publicInput.value = ''; autoResize(publicInput); publicInput.focus();
        socket.emit('typingStop', { roomId: 'public', username: currentUser.username });
        socket.emit('sendMessage', { roomId: 'public', username: currentUser.username, text, fileName: '', _tempId: tempId });
        canSend = false; publicSend.classList.add('disabled');
        cooldownBar.style.transition = 'none'; cooldownBar.style.width = '0';
        requestAnimationFrame(() => { cooldownBar.style.transition = 'width 3s linear'; cooldownBar.style.width = '100%'; });
        cooldownTimer = setTimeout(() => { canSend = true; publicSend.classList.remove('disabled'); cooldownBar.style.transition = 'none'; cooldownBar.style.width = '0'; }, 3000);
    }

    function attachMediaHandler() {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*,audio/*';
        inp.onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            if (f.size > 25*1024*1024) { alert('Файл не должен превышать 25 МБ'); return; }
            if (!canSend) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const tempId = 'temp_' + Date.now() + Math.random();
                const optimisticMsg = { id: tempId, _temp: true, _tempId: tempId, roomId: 'public', sender: currentUser.username, avatar_emoji: currentUser.avatar_emoji || '', avatar_color: currentUser.avatar_color || '', text: ev.target.result, fileName: f.name, timestamp: new Date().toISOString() };
                publicMessagesCache.push(optimisticMsg);
                appendMessageElement(optimisticMsg, true);
                publicMessagesEl.scrollTop = publicMessagesEl.scrollHeight;
                socket.emit('sendMessage', { roomId: 'public', username: currentUser.username, text: ev.target.result, fileName: f.name, _tempId: tempId });
                canSend = false; publicSend.classList.add('disabled');
                cooldownBar.style.transition = 'none'; cooldownBar.style.width = '0';
                requestAnimationFrame(() => { cooldownBar.style.transition = 'width 3s linear'; cooldownBar.style.width = '100%'; });
                cooldownTimer = setTimeout(() => { canSend = true; publicSend.classList.remove('disabled'); cooldownBar.style.transition = 'none'; cooldownBar.style.width = '0'; }, 3000);
            };
            reader.readAsDataURL(f);
        };
        inp.click();
    }
    publicAttach.onclick = attachMediaHandler;

    function escapeHtml(t) { return t.replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m])); }
    function formatDate(ts) { return new Date(ts).toLocaleDateString('ru-RU', { year:'numeric', month:'long', day:'numeric' }); }

    function renderBubble(msg, own, skipPlaceholder = false) {
        const time = new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
        const isMedia = msg.text?.startsWith('data:');
        let content = '', bubbleClass = '';
        if (isMedia) {
            bubbleClass = 'media-bubble';
            const src = msg.text;
            const fileName = msg.fileName || '';
            if (src.startsWith('data:video')) {
                content = `<div class="media-placeholder" style="cursor:default;"><i class="fas fa-video-slash"></i><span>Видео недоступно</span></div>`;
            } else if (own || skipPlaceholder) {
                if (src.startsWith('data:audio')) {
                    content = `<div class="custom-audio" data-src="${src}" data-filename="${escapeHtml(fileName)}">
                        <button class="voice-btn"><i class="fas fa-microphone"></i></button>
                    </div>`;
                } else if (src.startsWith('data:image')) {
                    content = `<img src="${src}" class="message-media" onclick="window.openMedia('${src}')">`;
                }
                if (src.startsWith('data:image')) {
                    content += `<button class="message-download-btn" onclick="event.stopPropagation(); window.downloadMedia('${src}')"><i class="fas fa-download"></i></button>`;
                }
            } else {
                content = `<div class="media-placeholder" data-src="${src}" data-filename="${escapeHtml(fileName)}" onclick="window.loadMediaPlaceholder(this)">
                    <i class="fas fa-download"></i><span>Загрузить медиа</span></div>`;
            }
        } else {
            content = `<div class="message-text">${escapeHtml(msg.text)}</div>`;
        }
        return `<div class="message-bubble ${own ? 'message-bubble-own' : ''} ${bubbleClass}">${own ? '' : `<div class="message-sender">${escapeHtml(msg.sender)}</div>`}${content}<div class="message-time">${time}</div></div>`;
    }

    function renderAvatar(emoji, color, username) {
        return `<div class="message-avatar" style="background:${color||'#ccc'};">${emoji || (username?.[0]?.toUpperCase()||'?')}</div>`;
    }

    function addMessageWithDate(container, msg, prevDate, skipPlaceholder = false) {
        const msgDate = new Date(msg.timestamp).toDateString();
        if (prevDate && prevDate !== msgDate) {
            const sep = document.createElement('div'); sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatDate(msg.timestamp)}</span>`;
            container.appendChild(sep);
        }
        const own = msg.sender === currentUser?.username;
        const div = document.createElement('div'); div.className = `message ${own ? 'message-own' : ''}`;
        if (!own) div.innerHTML = renderAvatar(msg.avatar_emoji, msg.avatar_color, msg.sender);
        const content = document.createElement('div'); content.className = 'message-content';
        content.innerHTML = renderBubble(msg, own, skipPlaceholder || own);
        div.appendChild(content);
        container.appendChild(div);
        return div;
    }

    function displayPublicMessages(initial) {
        publicMessagesEl.innerHTML = '';
        let last = null;
        publicMessagesCache.forEach(m => last = addMessageWithDate(publicMessagesEl, m, last, false));
        // Инициализация всех аудио-плееров (для своих и загруженных ранее)
        document.querySelectorAll('.custom-audio').forEach(w => window.initCustomAudio(w));
        if (initial) publicMessagesEl.scrollTop = publicMessagesEl.scrollHeight;
    }

    profileBtn.onclick = () => { updateAvatarPreview(); profileUsernameDisplay.textContent = currentUser.username; profileModal.style.display = 'flex'; };
    profileCloseBtn.onclick = () => profileModal.style.display = 'none';
    changeAvatarBtn.onclick = () => { populateAvatarPicker(); avatarPickerModal.style.display = 'flex'; };
    avatarCancelBtn.onclick = () => avatarPickerModal.style.display = 'none';
    avatarSaveBtn.onclick = async () => {
        if (!currentUser) return;
        await fetch(API_BASE + '/api/update-avatar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser.username, emoji: selectedEmoji, color: selectedColor }) });
        currentUser.avatar_emoji = selectedEmoji; currentUser.avatar_color = selectedColor;
        localStorage.setItem('chatxUser', JSON.stringify(currentUser)); updateAvatarPreview();
        avatarPickerModal.style.display = 'none';
    };
    themeToggleBtn.textContent = currentTheme === 'light' ? 'Светлая' : (currentTheme === 'dark' ? 'Тёмная' : 'Авто');
    themeToggleBtn.onclick = () => {
        currentTheme = currentTheme === 'light' ? 'dark' : (currentTheme === 'dark' ? 'system' : 'light');
        localStorage.setItem('chatxTheme', currentTheme); applyTheme();
        themeToggleBtn.textContent = currentTheme === 'light' ? 'Светлая' : (currentTheme === 'dark' ? 'Тёмная' : 'Авто');
    };
    logoutBtn.onclick = () => { if (socket) socket.close(); localStorage.removeItem('chatxUser'); currentUser = null; profileModal.style.display = 'none'; showAuth(); };
    publicParticipantCount.onclick = async () => {
        participantsModal.style.display = 'flex'; participantsList.innerHTML = ''; participantsLoading.style.display = 'block';
        try { const res = await fetch(API_BASE + '/api/rooms/participants/public'); const users = await res.json(); participantsList.innerHTML = users.map(u => `<li>${escapeHtml(u)}</li>`).join(''); }
        catch { participantsList.innerHTML = '<li style="color:#ff6b6b;">Ошибка</li>'; }
        finally { participantsLoading.style.display = 'none'; }
    };
    participantsCloseBtn.onclick = () => participantsModal.style.display = 'none';
    window.openMedia = src => { mediaViewContainer.innerHTML = src.startsWith('data:video') ? `<video controls src="${src}"></video>` : `<img src="${src}">`; mediaViewModal.style.display = 'flex'; };
    window.downloadMedia = src => { const a = document.createElement('a'); a.href = src; a.download = 'media_'+Date.now(); document.body.appendChild(a); a.click(); document.body.removeChild(a); };
    function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; ta.style.overflowY = ta.scrollHeight > 120 ? 'auto' : 'hidden'; }
    publicInput.addEventListener('input', () => autoResize(publicInput));
})();
</script>
</body>
</html>
