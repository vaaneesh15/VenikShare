<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatX</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChatX">
    <meta name="theme-color" id="theme-color-meta" content="#000000">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
        html, body {
            width:100%; height:100%; overflow:hidden;
            background: linear-gradient(145deg, #e9e9f0, #dadde8);
        }
        body.dark {
            background: linear-gradient(145deg, #000000, #121212);
        }
        body {
            --bg-gradient-start:#e9e9f0;
            --bg-gradient-end:#dadde8;
            --container-bg:rgba(240,240,245,0.7);
            --container-border:rgba(255,255,255,0.5);
            --text-primary:#1a1a2e;
            --text-secondary:#2c3e50;
            --text-muted:#6b6b80;
            --accent:#4a3aff;
            --accent-light:#7a6aff;
            --card-bg:rgba(255,255,255,0.6);
            --card-border:rgba(255,255,255,0.6);
            --shadow:0 25px 50px -12px rgba(0,0,0,0.2);
            --icon-bg:white;
            --panel-bg:rgba(255,255,255,0.7);
            --input-bg:rgba(255,255,255,0.5);
            --chat-own-bg:var(--accent);
            --chat-other-bg:#e0e0f0;
            --chat-own-text:white;
            --chat-other-text:#1a1a2e;
            transition: background 0.2s, color 0.2s;
        }
        body.dark {
            --bg-gradient-start:#000000;
            --bg-gradient-end:#121212;
            --container-bg:rgba(0,0,0,0.8);
            --container-border:rgba(255,255,255,0.15);
            --text-primary:#f0f0ff;
            --text-secondary:#ecf0f1;
            --text-muted:#8a8aa0;
            --accent:#6d5fff;
            --accent-light:#9a8cff;
            --card-bg:rgba(20,20,30,0.7);
            --card-border:rgba(255,255,255,0.1);
            --shadow:0 25px 50px -12px rgba(0,0,0,0.6);
            --icon-bg:#1e1e2a;
            --panel-bg:rgba(0,0,0,0.8);
            --input-bg:rgba(20,20,30,0.6);
            --chat-other-bg:#2a2a3a;
            --chat-other-text:#ffffff;
        }

        #auth-screen {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999;
            background: inherit;
            display:flex; flex-direction:column; justify-content:center; align-items:center; padding:16px;
        }
        #auth-screen.hidden { display:none; }
        .auth-panel {
            background:var(--panel-bg); backdrop-filter:blur(10px); border-radius:36px;
            padding:24px 20px; border:1px solid var(--container-border); box-shadow:var(--shadow);
            width:100%; max-width:360px;
        }
        .input-group { display:flex; gap:8px; margin-bottom:12px; }
        .input-group input { flex:1; background:var(--input-bg); border:1px solid var(--card-border); border-radius:40px; padding:14px 18px; font-size:16px; color:var(--text-primary); outline:none; }
        .btn { background:var(--icon-bg); border:1px solid var(--card-border); border-radius:40px; padding:14px 24px; font-size:16px; font-weight:600; color:var(--accent); cursor:pointer; width:100%; text-align:center; }
        .btn-primary { background:var(--accent); color:white; border:none; }
        .status { text-align:center; color:var(--text-muted); margin:8px 0; font-size:14px; }
        .flex-col { display:flex; flex-direction:column; gap:12px; }

        #main-screen {
            display:flex; flex-direction:column; height:100dvh; background:transparent;
        }
        .chat-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:60px 16px 12px 16px;
            border-bottom:1px solid var(--container-border);
            background:var(--container-bg);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            flex-shrink:0;
        }
        .chat-header-left { display:flex; align-items:center; gap:12px; }
        .profile-btn { background:var(--icon-bg); width:40px; height:40px; border-radius:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--container-border); color:var(--accent); font-size:20px; box-shadow:0 6px 12px rgba(0,0,0,0.05); }
        .participant-count { background:var(--icon-bg); border-radius:30px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:var(--accent); border:1px solid var(--card-border); cursor:pointer; }

        .chat-messages {
            flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:4px;
            -webkit-overflow-scrolling:touch;
        }
        .chat-input-area {
            display:flex; align-items:flex-end; gap:8px; padding:8px 16px 0px 16px;
            border-top:1px solid var(--container-border);
            background:var(--panel-bg);
            backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
            flex-shrink:0;
        }
        .chat-input-area textarea {
            flex:1; background:var(--input-bg); border:1px solid var(--card-border); border-radius:30px;
            padding:12px 18px; font-size:16px; color:var(--text-primary); outline:none;
            resize:none; min-height:44px; max-height:120px; line-height:1.4; overflow-y:auto;
        }
        .chat-input-area button {
            width:48px; height:48px; border-radius:30px; padding:0; font-size:22px;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .attach-btn { background:var(--icon-bg); border:1px solid var(--card-border); color:var(--accent); }
        #public-send {
            background:var(--accent); color:white; border:none; overflow:hidden; position:relative;
        }
        #public-send .cooldown-bar {
            position:absolute; bottom:0; left:0; height:100%; width:0;
            background:rgba(255,255,255,0.3); transition:width 3s linear; pointer-events:none;
        }
        #public-send.disabled { pointer-events:none; opacity:0.7; }

        .message { display:flex; margin-bottom:4px; align-items:flex-start; gap:8px; }
        .message-own { justify-content:flex-end; }
        .message-avatar {
            width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:20px; flex-shrink:0; cursor:pointer; color:#fff; background:#ccc;
        }
        .message-own .message-avatar { display:none; }
        .message-content { max-width:calc(80% - 48px); display:flex; flex-direction:column; }
        .message-bubble {
            background:var(--chat-other-bg); border-radius:24px; padding:10px 16px;
            border:1px solid var(--card-border); word-break:break-word; color:var(--chat-other-text);
            position:relative;
        }
        .message-bubble-own { background:var(--chat-own-bg); color:var(--chat-own-text); border-color:var(--accent-light); }
        .message-sender { font-size:13px; font-weight:600; margin-bottom:4px; color:var(--accent); }
        .message-text { font-size:15px; line-height:1.4; }
        .message-time { font-size:11px; opacity:0.7; margin-top:4px; text-align:right; }
        .message-media { max-width:200px; max-height:200px; border-radius:16px; cursor:pointer; margin-bottom:30px; display:block; }
        .message-download-btn {
            position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,0.5); color:white;
            border-radius:20px; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
            cursor:pointer; border:none; font-size:16px; z-index:2;
        }
        .date-separator { display:flex; justify-content:center; margin:12px 0; }
        .date-separator span {
            background:var(--panel-bg); backdrop-filter:blur(10px); padding:4px 16px;
            border-radius:30px; font-size:13px; color:var(--text-muted); border:1px solid var(--container-border);
        }

        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background:var(--panel-bg); backdrop-filter:blur(20px); border-radius:36px; padding:24px; max-width:90%; width:400px; border:1px solid var(--container-border); position:relative; }
        .modal-buttons { display:flex; gap:12px; margin-top:20px; }
        .profile-avatar { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
        .avatar-circle { width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; color:#fff; background:#ccc; flex-shrink:0; }
        .horizontal-scroll { display:flex; gap:8px; overflow-x:auto; padding:8px 0; -webkit-overflow-scrolling:touch; }
        .horizontal-scroll::-webkit-scrollbar { display:none; }
        .color-option, .emoji-option { flex-shrink:0; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid transparent; font-size:24px; }
        .color-option.selected, .emoji-option.selected { border-color:var(--accent); }
        #media-view-modal .modal-content { background:transparent; backdrop-filter:none; box-shadow:none; display:flex; justify-content:center; align-items:center; padding:0; width:100%; height:100%; max-width:100%; max-height:100%; border-radius:0; position:relative; }
        #media-view-modal img, #media-view-modal video { max-width:90vw; max-height:80vh; border-radius:16px; object-fit:contain; cursor:default; }
        #media-view-close-btn { position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.6); color:white; border:none; border-radius:50%; width:44px; height:44px; font-size:24px; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center; }
        .loading-spinner { text-align:center; padding:20px; color:var(--text-muted); }
        .participant-list { list-style:none; max-height:300px; overflow-y:auto; margin-top:16px; }
        .participant-list li { padding:8px 0; border-bottom:1px solid var(--card-border); color:var(--text-primary); }
        .flex-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-panel">
        <div class="input-group"><input type="text" id="auth-username" placeholder="Имя пользователя"></div>
        <div class="input-group"><input type="password" id="auth-password" placeholder="Пароль"></div>
        <div class="flex-col">
            <button class="btn btn-primary" id="auth-login">Войти</button>
            <button class="btn" id="auth-register">Зарегистрироваться</button>
        </div>
        <div id="auth-status" class="status"></div>
    </div>
</div>

<div id="main-screen" style="display:none;">
    <div class="chat-header">
        <div class="chat-header-left">
            <div class="profile-btn" id="profile-btn"><i class="fas fa-user"></i></div>
        </div>
        <div class="participant-count" id="public-participant-count" title="Участники онлайн">0</div>
    </div>
    <div class="chat-messages" id="public-messages"></div>
    <div class="chat-input-area">
        <textarea id="public-input" rows="1" placeholder="Написать..."></textarea>
        <button class="btn attach-btn" id="public-attach"><i class="fas fa-paperclip"></i></button>
        <button class="btn btn-primary" id="public-send">
            <i class="fas fa-paper-plane"></i>
            <div class="cooldown-bar" id="cooldown-bar"></div>
        </button>
    </div>
</div>

<div id="profile-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3 style="color:var(--text-primary); margin-bottom:16px;">Профиль</h3>
        <div class="profile-avatar">
            <div class="avatar-circle" id="profile-avatar-circle"></div>
            <button class="btn" id="change-avatar-btn" style="width:auto; padding:12px 20px;">Изменить</button>
        </div>
        <div style="margin-bottom:20px;">
            <div style="color:var(--text-primary); font-size:18px; margin-bottom:8px;">Имя пользователя</div>
            <span style="color:var(--accent); font-size:24px; font-weight:600;" id="profile-username-display"></span>
        </div>
        <div style="margin:16px 0;">
            <div class="flex-row" style="justify-content:space-between;">
                <span style="color:var(--text-primary);">Тема</span>
                <button class="btn" id="theme-toggle-btn" style="width:auto;">Авто</button>
            </div>
        </div>
        <button class="btn" id="logout-btn" style="margin-top:16px;">Выйти</button>
        <div class="modal-buttons">
            <button class="btn" id="profile-close-btn">Закрыть</button>
        </div>
    </div>
</div>

<div id="avatar-picker-modal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:95%; width:auto;">
        <h3 style="color:var(--text-primary); margin-bottom:16px;">Изменить аватар</h3>
        <div style="margin-bottom:16px;">
            <div style="color:var(--text-primary); margin-bottom:8px;">Фон</div>
            <div class="horizontal-scroll" id="color-scroll"></div>
        </div>
        <div style="margin-bottom:16px;">
            <div style="color:var(--text-primary); margin-bottom:8px;">Эмодзи</div>
            <div class="horizontal-scroll" id="emoji-scroll"></div>
        </div>
        <div class="modal-buttons">
            <button class="btn" id="avatar-cancel-btn">Отмена</button>
            <button class="btn btn-primary" id="avatar-save-btn">Сохранить</button>
        </div>
    </div>
</div>

<div id="participants-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3 style="color:var(--text-primary); margin-bottom:16px;">Участники онлайн</h3>
        <div id="participants-loading" class="loading-spinner" style="display:none;">Загрузка...</div>
        <ul id="participants-list" class="participant-list"></ul>
        <div class="modal-buttons"><button class="btn" id="participants-close-btn">Закрыть</button></div>
    </div>
</div>

<div id="media-view-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <button id="media-view-close-btn" onclick="document.getElementById('media-view-modal').style.display='none'"><i class="fas fa-times"></i></button>
        <div id="media-view-container"></div>
    </div>
</div>

<script>
(function() {
    const API_BASE = '';
    let currentUser = null;
    let socket = null;
    let publicMessagesCache = [];
    let canSend = true;
    let cooldownTimer = null;
    const EMOJI_LIST = ['😀','😂','😍','👍','🔥','🎉','💡','❤️','😎','🤔','😢','😡','🥳','😴','🤯','😇','🙃','🤑','🤠','😈'];
    const COLORS = ['#E57373','#F06292','#BA68C8','#9575CD','#7986CB','#64B5F6','#4FC3F7','#4DD0E1','#4DB6AC','#81C784','#AED581','#DCE775','#FFD54F','#FFB74D','#FF8A65','#A1887F','#E0E0E0','#90A4AE'];

    let selectedEmoji = '';
    let selectedColor = '#ccc';

    let currentTheme = localStorage.getItem('chatxTheme') || 'system';
    function applyTheme() {
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isDark = currentTheme === 'dark' || (currentTheme === 'system' && systemDark);
        document.body.classList.toggle('dark', isDark);
        document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#000000' : '#4a3aff');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    applyTheme();

    const authScreen = document.getElementById('auth-screen');
    const mainScreen = document.getElementById('main-screen');
    const authUsername = document.getElementById('auth-username');
    const authPassword = document.getElementById('auth-password');
    const authStatus = document.getElementById('auth-status');
    const authLogin = document.getElementById('auth-login');
    const authRegister = document.getElementById('auth-register');
    const publicMessagesEl = document.getElementById('public-messages');
    const publicInput = document.getElementById('public-input');
    const publicSend = document.getElementById('public-send');
    const publicAttach = document.getElementById('public-attach');
    const publicParticipantCount = document.getElementById('public-participant-count');
    const profileBtn = document.getElementById('profile-btn');
    const profileModal = document.getElementById('profile-modal');
    const profileAvatarCircle = document.getElementById('profile-avatar-circle');
    const changeAvatarBtn = document.getElementById('change-avatar-btn');
    const avatarPickerModal = document.getElementById('avatar-picker-modal');
    const colorScroll = document.getElementById('color-scroll');
    const emojiScroll = document.getElementById('emoji-scroll');
    const avatarCancelBtn = document.getElementById('avatar-cancel-btn');
    const avatarSaveBtn = document.getElementById('avatar-save-btn');
    const profileUsernameDisplay = document.getElementById('profile-username-display');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const profileCloseBtn = document.getElementById('profile-close-btn');
    const participantsModal = document.getElementById('participants-modal');
    const participantsList = document.getElementById('participants-list');
    const participantsLoading = document.getElementById('participants-loading');
    const participantsCloseBtn = document.getElementById('participants-close-btn');
    const mediaViewModal = document.getElementById('media-view-modal');
    const mediaViewContainer = document.getElementById('media-view-container');
    const cooldownBar = document.getElementById('cooldown-bar');

    function showMain() { authScreen.classList.add('hidden'); mainScreen.style.display = 'flex'; }
    function showAuth() { authScreen.classList.remove('hidden'); mainScreen.style.display = 'none'; }

    function populateAvatarPicker() {
        colorScroll.innerHTML = '';
        COLORS.forEach(color => {
            const div = document.createElement('div');
            div.className = 'color-option' + (color === selectedColor ? ' selected' : '');
            div.style.backgroundColor = color;
            div.addEventListener('click', () => { selectedColor = color; updateAvatarPickerSelection(); });
            colorScroll.appendChild(div);
        });
        emojiScroll.innerHTML = '';
        EMOJI_LIST.forEach(emoji => {
            const div = document.createElement('div');
            div.className = 'emoji-option' + (emoji === selectedEmoji ? ' selected' : '');
            div.textContent = emoji;
            div.addEventListener('click', () => { selectedEmoji = emoji; updateAvatarPickerSelection(); });
            emojiScroll.appendChild(div);
        });
    }
    function updateAvatarPickerSelection() {
        document.querySelectorAll('.color-option').forEach(el => el.classList.toggle('selected', el.style.backgroundColor === selectedColor));
        document.querySelectorAll('.emoji-option').forEach(el => el.classList.toggle('selected', el.textContent === selectedEmoji));
    }
    function updateAvatarPreview() {
        profileAvatarCircle.textContent = selectedEmoji || (currentUser ? currentUser.username[0].toUpperCase() : '?');
        profileAvatarCircle.style.backgroundColor = selectedColor;
    }

    async function login(username, password) {
        try {
            const res = await fetch(API_BASE + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка');
            currentUser = { username: data.username, avatar_emoji: data.avatar_emoji || '', avatar_color: data.avatar_color || '' };
            selectedEmoji = currentUser.avatar_emoji;
            selectedColor = currentUser.avatar_color || '#ccc';
            localStorage.setItem('chatxUser', JSON.stringify(currentUser));
            updateAvatarPreview();
            showMain();
            profileUsernameDisplay.textContent = currentUser.username;
            connectSocket();
        } catch (err) { authStatus.textContent = err.message; }
    }
    async function register(username, password) {
        try {
            const res = await fetch(API_BASE + '/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка');
            authStatus.textContent = 'Регистрация успешна, вход...';
            await login(username, password);
        } catch (err) { authStatus.textContent = err.message; }
    }
    authLogin.addEventListener('click', () => {
        const u = authUsername.value.trim(), p = authPassword.value.trim();
        if (u && p) login(u, p); else authStatus.textContent = 'Введите имя и пароль';
    });
    authRegister.addEventListener('click', () => {
        const u = authUsername.value.trim(), p = authPassword.value.trim();
        if (u && p) register(u, p); else authStatus.textContent = 'Введите имя и пароль';
    });

    const savedUser = localStorage.getItem('chatxUser');
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        selectedEmoji = currentUser.avatar_emoji || '';
        selectedColor = currentUser.avatar_color || '#ccc';
        updateAvatarPreview();
        fetch(API_BASE + '/api/avatar/' + currentUser.username).then(r => r.json()).then(data => {
            if (data.emoji !== undefined) {
                currentUser.avatar_emoji = data.emoji || '';
                currentUser.avatar_color = data.color || '';
                selectedEmoji = currentUser.avatar_emoji;
                selectedColor = currentUser.avatar_color || '#ccc';
                updateAvatarPreview();
            }
        }).catch(() => {});
        showMain();
        profileUsernameDisplay.textContent = currentUser.username;
        connectSocket();
    } else {
        showAuth();
    }

    function connectSocket() {
        if (socket) socket.close();
        socket = io({ reconnectionAttempts: 5, timeout: 10000 });
        socket.on('connect', () => console.log('✅ Socket connected'));
        socket.on('roomError', d => alert(d.message));
        socket.on('roomJoined', d => {
            publicMessagesCache = d.messages;
            displayPublicMessages();
            publicParticipantCount.textContent = d.userCount;
        });
        socket.on('newMessage', d => {
            publicMessagesCache.push(d);
            addPublicMessageToChat(d);
        });
        socket.on('userCount', d => { publicParticipantCount.textContent = d.count; });
        socket.emit('joinRoom', { roomId: 'public', username: currentUser.username });
    }

    function sendMessage() {
        if (!canSend || !socket || !currentUser) return;
        const text = publicInput.value.trim();
        if (!text) return;
        socket.emit('sendMessage', { roomId: 'public', username: currentUser.username, text });
        publicInput.value = '';
        autoResize(publicInput);
        publicInput.focus();
        canSend = false;
        publicSend.classList.add('disabled');
        cooldownBar.style.transition = 'none';
        cooldownBar.style.width = '0';
        requestAnimationFrame(() => {
            cooldownBar.style.transition = 'width 3s linear';
            cooldownBar.style.width = '100%';
        });
        cooldownTimer = setTimeout(() => {
            canSend = true;
            publicSend.classList.remove('disabled');
            cooldownBar.style.transition = 'none';
            cooldownBar.style.width = '0';
        }, 3000);
    }

    publicSend.addEventListener('click', sendMessage);
    publicInput.addEventListener('keypress', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (canSend) sendMessage(); } });

    function attachMediaHandler() {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '*/*';
        inp.onchange = e => {
            const f = e.target.files[0];
            if (!f) return;
            if (f.size > 10 * 1024 * 1024) { alert('Файл не должен превышать 10 МБ'); return; }
            const r = new FileReader();
            r.onload = ev => {
                if (canSend) {
                    socket.emit('sendMessage', { roomId: 'public', username: currentUser.username, text: ev.target.result });
                    canSend = false;
                    publicSend.classList.add('disabled');
                    cooldownBar.style.transition = 'none';
                    cooldownBar.style.width = '0';
                    requestAnimationFrame(() => {
                        cooldownBar.style.transition = 'width 3s linear';
                        cooldownBar.style.width = '100%';
                    });
                    cooldownTimer = setTimeout(() => {
                        canSend = true;
                        publicSend.classList.remove('disabled');
                        cooldownBar.style.transition = 'none';
                        cooldownBar.style.width = '0';
                    }, 3000);
                }
            };
            r.readAsDataURL(f);
        };
        inp.click();
    }
    publicAttach.addEventListener('click', attachMediaHandler);

    function formatDateHeader(ts) { return new Date(ts).toLocaleDateString('ru-RU', { year:'numeric', month:'long', day:'numeric' }); }
    function escapeHtml(t) { return t.replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m])); }
    function renderMessageBubble(msg, own) {
        const time = new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
        const isMedia = msg.text?.startsWith('data:');
        let content = '';
        if (isMedia) {
            if (msg.text.startsWith('data:image')) content = `<img src="${msg.text}" class="message-media" onclick="window.openMedia('${msg.text}')">`;
            else if (msg.text.startsWith('data:video')) content = `<video controls class="message-media" src="${msg.text}"></video>`;
            else if (msg.text.startsWith('data:audio')) content = `<audio controls src="${msg.text}"></audio>`;
            content += `<button class="message-download-btn" onclick="event.stopPropagation(); window.downloadMedia('${msg.text}')"><i class="fas fa-download"></i></button>`;
        } else {
            content = `<div class="message-text">${escapeHtml(msg.text)}</div>`;
        }
        return `<div class="message-bubble ${own ? 'message-bubble-own' : ''}">
            ${own ? '' : `<div class="message-sender">${escapeHtml(msg.sender)}</div>`}
            ${content}<div class="message-time">${time}</div></div>`;
    }

    function addMessageWithDate(container, msg, prevDate) {
        const msgDate = new Date(msg.timestamp).toDateString();
        if (prevDate !== msgDate) {
            const sep = document.createElement('div'); sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatDateHeader(msg.timestamp)}</span>`;
            container.appendChild(sep);
        }
        const own = msg.sender === currentUser?.username;
        const div = document.createElement('div');
        div.className = `message ${own ? 'message-own' : ''}`;
        if (!own) div.innerHTML = renderUserAvatar(msg.avatar_emoji, msg.avatar_color, msg.sender);
        const content = document.createElement('div'); content.className = 'message-content';
        content.innerHTML = renderMessageBubble(msg, own);
        div.appendChild(content);
        container.appendChild(div);
        return msgDate;
    }

    function renderUserAvatar(emoji, color, username) {
        const letter = emoji || (username ? username[0].toUpperCase() : '?');
        const bg = color || '#ccc';
        return `<div class="message-avatar" style="background:${bg};">${letter}</div>`;
    }

    function displayPublicMessages() {
        publicMessagesEl.innerHTML = '';
        let last = null;
        publicMessagesCache.forEach(m => { last = addMessageWithDate(publicMessagesEl, m, last); });
        publicMessagesEl.scrollTop = publicMessagesEl.scrollHeight;
    }
    function addPublicMessageToChat(m) { displayPublicMessages(); }

    profileBtn.addEventListener('click', () => {
        updateAvatarPreview();
        profileUsernameDisplay.textContent = currentUser.username;
        profileModal.style.display = 'flex';
    });
    profileCloseBtn.addEventListener('click', () => profileModal.style.display = 'none');

    changeAvatarBtn.addEventListener('click', () => {
        populateAvatarPicker();
        avatarPickerModal.style.display = 'flex';
    });
    avatarCancelBtn.addEventListener('click', () => avatarPickerModal.style.display = 'none');
    avatarSaveBtn.addEventListener('click', async () => {
        if (!currentUser) return;
        await fetch(API_BASE + '/api/update-avatar', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ username: currentUser.username, emoji: selectedEmoji, color: selectedColor })
        });
        currentUser.avatar_emoji = selectedEmoji;
        currentUser.avatar_color = selectedColor;
        localStorage.setItem('chatxUser', JSON.stringify(currentUser));
        updateAvatarPreview();
        avatarPickerModal.style.display = 'none';
    });

    themeToggleBtn.textContent = currentTheme === 'light' ? 'Светлая' : (currentTheme === 'dark' ? 'Тёмная' : 'Авто');
    themeToggleBtn.addEventListener('click', () => {
        if (currentTheme === 'light') currentTheme = 'dark';
        else if (currentTheme === 'dark') currentTheme = 'system';
        else currentTheme = 'light';
        localStorage.setItem('chatxTheme', currentTheme);
        applyTheme();
        themeToggleBtn.textContent = currentTheme === 'light' ? 'Светлая' : (currentTheme === 'dark' ? 'Тёмная' : 'Авто');
    });

    logoutBtn.addEventListener('click', () => {
        if (socket) socket.close();
        localStorage.removeItem('chatxUser');
        currentUser = null;
        profileModal.style.display = 'none';
        showAuth();
    });

    publicParticipantCount.addEventListener('click', async () => {
        participantsModal.style.display = 'flex';
        participantsList.innerHTML = '';
        participantsLoading.style.display = 'block';
        try {
            const res = await fetch(API_BASE + '/api/rooms/participants/public');
            const users = await res.json();
            participantsList.innerHTML = users.map(u => `<li>${escapeHtml(u)}</li>`).join('');
        } catch (e) { participantsList.innerHTML = '<li style="color:#ff6b6b;">Ошибка</li>'; }
        finally { participantsLoading.style.display = 'none'; }
    });
    participantsCloseBtn.addEventListener('click', () => participantsModal.style.display = 'none');

    window.openMedia = (src) => {
        mediaViewContainer.innerHTML = src.startsWith('data:video') ? `<video controls src="${src}"></video>` : `<img src="${src}">`;
        mediaViewModal.style.display = 'flex';
    };
    window.downloadMedia = (src) => { const a = document.createElement('a'); a.href = src; a.download = 'media_' + Date.now(); document.body.appendChild(a); a.click(); document.body.removeChild(a); };

    function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; ta.style.overflowY = ta.scrollHeight > 120 ? 'auto' : 'hidden'; }
    publicInput.addEventListener('input', () => autoResize(publicInput));
})();
</script>
</body>
</html>
