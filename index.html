<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лента анкет сервера</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #121016;
      color: #eae6f0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Навигация */
    nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1b1922;
      padding: 10px 20px;
      border-bottom: 1px solid #2b2635;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    nav a, nav button {
      color: #c5bfd4;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 15px;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    nav a.active {
      background: #3a3152;
      color: #e3d9ff;
    }
    nav a:hover:not(.active) { background: #252232; }
    #refreshBtn {
      margin-left: auto;
      background: #252232;
      color: #c5bfd4;
      border: 1px solid #363145;
      font-weight: 500;
    }
    #refreshBtn:hover { background: #302b3d; }

    .container { max-width: 720px; margin: 24px auto; padding: 0 20px; }

    /* Карточки */
    .card {
      background: #1e1b26;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
      border: 1px solid #2a2536;
      transition: border 0.2s;
    }
    .card:hover { border-color: #4a3f62; }

    /* Поля формы */
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #cbbef0; }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: #16131e;
      border: 1px solid #332e42;
      border-radius: 12px;
      font-size: 15px;
      color: #eae6f0;
      transition: border 0.2s, background 0.2s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #7e6ab3;
      background: #1c1926;
    }
    textarea { resize: vertical; min-height: 100px; }

    /* Кнопки */
    .buttons { display: flex; gap: 10px; margin-top: 8px; }
    .buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .buttons button:active { transform: scale(0.98); }

    .btn-primary { background: #6c52b3; color: white; }
    .btn-primary:hover { background: #7e62cc; }
    .btn-secondary { background: #262231; color: #ccc0e8; border: 1px solid #3b334a; }
    .btn-secondary:hover { background: #302a3d; }
    .btn-danger { background: #3d1e28; color: #f5a3b3; border: 1px solid #5a2e3a; }
    .btn-danger:hover { background: #4c2632; }

    /* Статусы */
    .status {
      display: inline-block;
      font-weight: 600;
      font-size: 13px;
      padding: 2px 12px;
      border-radius: 20px;
    }

    /* Модальные окна */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #1f1b2b;
      padding: 24px;
      border-radius: 20px;
      width: 320px;
      border: 1px solid #3a3050;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    /* Админ кнопки */
    .admin-btn {
      display: inline-block;
      margin-right: 8px;
      background: #4b3a72;
      color: #ddd0ff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .admin-btn.reject { background: #6b2c38; color: #ffc2cc; }
    .admin-btn.reject:hover { background: #853b48; }
    .admin-btn.accept:hover { background: #5c4990; }

    .hidden { display: none; }
    .app-field { margin-bottom: 6px; }
    .app-field strong { color: #b6a8d6; }

    h2, h3 { color: #ede4ff; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <a href="#" id="feedTab" class="active">Лента анкет</a>
    <a href="#" id="myTab">Моя анкета</a>
    <button id="refreshBtn">Обновить</button>
  </nav>

  <div class="container">
    <div id="feedSection">
      <h2 style="margin-bottom:16px;">Все анкеты</h2>
      <div id="feedList"></div>
    </div>

    <div id="mySection" class="hidden">
      <div id="myFormBlock">
        <h2 style="margin-bottom:16px;">Новая анкета</h2>
        <div class="form-group"><label>Ник</label><input id="nickname" type="text" placeholder="Ваш игровой ник"></div>
        <div class="form-group"><label>Описание</label><textarea id="description" minlength="20" maxlength="350" placeholder="Например, откуда узнали о сервере, чем планируете заниматься, соглашаетесь ли Вы не гриферить и не читерить и так далее… (от 20 до 350 символов)"></textarea></div>
        <div class="form-group"><label>Возраст</label><input id="age" type="number" min="1" placeholder="Возраст"></div>
        <div class="form-group">
          <label>Пол</label>
          <select id="gender">
            <option value="">— выберите —</option>
            <option>Мужской</option>
            <option>Женский</option>
            <option>Не важно</option>
          </select>
        </div>
        <div class="buttons">
          <button id="resetBtn" class="btn-secondary">Сброс анкеты</button>
          <button id="submitBtn" class="btn-primary">Отправить</button>
        </div>
      </div>
      <div id="myApplicationBlock" class="hidden">
        <!-- динамическое содержимое -->
      </div>
    </div>
  </div>

  <!-- Модальное окно входа администратора -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:16px;">Вход администратора</h3>
      <div class="form-group"><label>Ник</label><input id="adminUsername" type="text"></div>
      <div class="form-group"><label>Пароль</label><input id="adminPassword" type="password"></div>
      <div class="buttons">
        <button id="adminCancel" class="btn-secondary">Отмена</button>
        <button id="adminLogin" class="btn-primary">Войти</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно подтверждения отзыва -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <p style="margin-bottom:16px;">Вы уверены, что хотите отозвать анкету?</p>
      <div class="buttons">
        <button id="withdrawCancel" class="btn-secondary">Отмена</button>
        <button id="withdrawConfirm" class="btn-danger">Отозвать</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let currentTab = 'feed';
    let isAdmin = false;
    let adminToken = localStorage.getItem('adminToken');
    let feedData = [];

    if (adminToken) isAdmin = true;

    // Навигация
    document.getElementById('feedTab').addEventListener('click', (e) => { e.preventDefault(); switchTab('feed'); });
    document.getElementById('myTab').addEventListener('click', (e) => { e.preventDefault(); switchTab('my'); });
    document.getElementById('refreshBtn').addEventListener('click', refreshFeed);

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('feedTab').classList.toggle('active', tab === 'feed');
      document.getElementById('myTab').classList.toggle('active', tab === 'my');
      document.getElementById('feedSection').classList.toggle('hidden', tab !== 'feed');
      document.getElementById('mySection').classList.toggle('hidden', tab !== 'my');
      if (tab === 'feed') refreshFeed();
      if (tab === 'my') loadMyApplication();
    }

    // 7 кликов для админа
    let clickCount = 0;
    let clickTimer = null;
    const feedTab = document.getElementById('feedTab');
    feedTab.addEventListener('click', (e) => {
      // Только если клик не по активной вкладке? Мы обрабатываем все клики, включая переключение вкладки.
      // Но чтобы не мешать навигации, используем отдельную логику: подсчёт идёт по каждому клику,
      // но переход на вкладку подавлять не будем. При 7 кликах откроем админку.
      e.stopPropagation(); // чтобы не срабатывал switchTab дважды? Нет, лучше дать ему сработать.
      clickCount++;
      clearTimeout(clickTimer);
      if (clickCount >= 7) {
        clickCount = 0;
        showAdminLogin();
      } else {
        clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
      }
      // При этом сам переход по вкладке всё равно произойдёт через обработчик выше.
    });

    // Админская модалка
    const adminModal = document.getElementById('adminModal');
    function showAdminLogin() {
      adminModal.style.display = 'flex';
      document.getElementById('adminUsername').value = '';
      document.getElementById('adminPassword').value = '';
    }
    document.getElementById('adminCancel').addEventListener('click', () => { adminModal.style.display = 'none'; });
    document.getElementById('adminLogin').addEventListener('click', async () => {
      const username = document.getElementById('adminUsername').value;
      const password = document.getElementById('adminPassword').value;
      try {
        const res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) throw new Error('Неверные данные');
        const data = await res.json();
        adminToken = data.token;
        isAdmin = true;
        localStorage.setItem('adminToken', adminToken);
        adminModal.style.display = 'none';
        refreshFeed();
      } catch(e) {
        alert('Ошибка входа: ' + e.message);
      }
    });

    // Лента анкет
    async function refreshFeed() {
      const feedList = document.getElementById('feedList');
      feedList.innerHTML = '<p>Загрузка...</p>';
      try {
        const headers = {};
        if (adminToken) headers['X-Admin-Token'] = adminToken;
        const res = await fetch(API_BASE + '/api/applications', { headers });
        feedData = await res.json();
        renderFeed();
      } catch(e) {
        feedList.innerHTML = '<p>Ошибка загрузки</p>';
      }
    }

    function statusBadge(status) {
      const colorMap = {
        'Актуально': { bg: '#3e2e5c', color: '#cbbef0' },
        'Принято': { bg: '#1e3b2f', color: '#a0d9b4' },
        'Отклонено': { bg: '#4a2632', color: '#f5a3b3' },
        'Отозвано': { bg: '#2a2533', color: '#8e8a9e' }
      };
      const style = colorMap[status] || { bg: '#2a2533', color: '#8e8a9e' };
      return `<span class="status" style="background:${style.bg}; color:${style.color}">${status}</span>`;
    }

    function renderFeed() {
      const feedList = document.getElementById('feedList');
      if (!feedData.length) {
        feedList.innerHTML = '<p>Нет анкет.</p>';
        return;
      }
      feedList.innerHTML = feedData.map(app => {
        let adminButtons = '';
        if (isAdmin && app.status === 'Актуально') {
          adminButtons = `
            <div style="margin-top:14px; display:flex; gap:10px;">
              <button class="admin-btn accept" data-id="${app.id}">Принять</button>
              <button class="admin-btn reject" data-id="${app.id}">Отклонить</button>
            </div>`;
        }
        const descriptionRow = (isAdmin && app.description)
          ? `<div class="app-field"><strong>Описание:</strong> ${app.description}</div>`
          : '';
        return `<div class="card">
          <div class="app-field"><strong>Ник:</strong> ${app.nickname}</div>
          ${descriptionRow}
          <div class="app-field"><strong>Пол:</strong> ${app.gender}</div>
          <div class="app-field"><strong>Возраст:</strong> ${app.age}</div>
          <div class="app-field"><strong>Статус:</strong> ${statusBadge(app.status)}</div>
          <div class="app-field"><strong>Отправлено:</strong> ${app.createdAt}</div>
          ${adminButtons}
        </div>`;
      }).join('');

      document.querySelectorAll('.admin-btn.accept').forEach(btn => {
        btn.addEventListener('click', (e) => adminAction(e.target.dataset.id, 'accept'));
      });
      document.querySelectorAll('.admin-btn.reject').forEach(btn => {
        btn.addEventListener('click', (e) => adminAction(e.target.dataset.id, 'reject'));
      });
    }

    async function adminAction(appId, action) {
      if (!adminToken) return;
      try {
        const endpoint = action === 'accept' ? 'accept' : 'reject';
        const res = await fetch(`${API_BASE}/api/applications/${appId}/${endpoint}`, {
          method: 'PATCH',
          headers: { 'X-Admin-Token': adminToken }
        });
        if (!res.ok) throw new Error('Ошибка');
        refreshFeed();
      } catch(e) {
        alert('Не удалось выполнить действие');
      }
    }

    // Моя анкета
    async function loadMyApplication() {
      const id = localStorage.getItem('myApplicationId');
      if (!id) { showForm(); return; }
      try {
        const res = await fetch(`${API_BASE}/api/applications/${id}`);
        if (!res.ok) {
          localStorage.removeItem('myApplicationId');
          showForm();
          return;
        }
        const app = await res.json();
        showMyApplication(app);
      } catch(e) {
        showForm();
      }
    }

    function showForm() {
      document.getElementById('myFormBlock').classList.remove('hidden');
      document.getElementById('myApplicationBlock').classList.add('hidden');
      document.getElementById('nickname').value = '';
      document.getElementById('description').value = '';
      document.getElementById('age').value = '';
      document.getElementById('gender').value = '';
    }

    function showMyApplication(app) {
      document.getElementById('myFormBlock').classList.add('hidden');
      const block = document.getElementById('myApplicationBlock');
      block.classList.remove('hidden');
      let withdrawBtn = '';
      if (app.status !== 'Принято' && app.status !== 'Отозвано') {
        withdrawBtn = `<button id="withdrawBtn" class="btn-danger" style="margin-top:16px;">Отозвать анкету</button>`;
      }
      block.innerHTML = `<div class="card">
        <h3 style="margin-bottom:12px;">Моя анкета</h3>
        <div class="app-field"><strong>Ник:</strong> ${app.nickname}</div>
        <div class="app-field"><strong>Описание:</strong> ${app.description}</div>
        <div class="app-field"><strong>Возраст:</strong> ${app.age}</div>
        <div class="app-field"><strong>Пол:</strong> ${app.gender}</div>
        <div class="app-field"><strong>Статус:</strong> ${statusBadge(app.status)}</div>
        <div class="app-field"><strong>Отправлено:</strong> ${app.createdAt}</div>
        ${withdrawBtn}
      </div>`;
      if (withdrawBtn) {
        document.getElementById('withdrawBtn').addEventListener('click', showWithdrawModal);
      }
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const nickname = document.getElementById('nickname').value.trim();
      const description = document.getElementById('description').value.trim();
      const age = document.getElementById('age').value;
      const gender = document.getElementById('gender').value;
      if (!nickname || !description || !age || !gender) return alert('Заполните все поля');
      if (description.length < 20 || description.length > 350) return alert('Описание должно быть от 20 до 350 символов');
      try {
        const res = await fetch(API_BASE + '/api/applications', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, description, age, gender })
        });
        if (!res.ok) {
          const err = await res.json();
          return alert(err.error);
        }
        const app = await res.json();
        localStorage.setItem('myApplicationId', app.id);
        showMyApplication(app);
      } catch(e) {
        alert('Ошибка отправки');
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('nickname').value = '';
      document.getElementById('description').value = '';
      document.getElementById('age').value = '';
      document.getElementById('gender').value = '';
    });

    const withdrawModal = document.getElementById('withdrawModal');
    function showWithdrawModal() {
      withdrawModal.style.display = 'flex';
    }
    document.getElementById('withdrawCancel').addEventListener('click', () => {
      withdrawModal.style.display = 'none';
    });
    document.getElementById('withdrawConfirm').addEventListener('click', async () => {
      const id = localStorage.getItem('myApplicationId');
      if (!id) return;
      try {
        const res = await fetch(`${API_BASE}/api/applications/${id}/withdraw`, { method: 'PATCH' });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
        } else {
          localStorage.removeItem('myApplicationId');
          withdrawModal.style.display = 'none';
          showForm();
          refreshFeed();
        }
      } catch(e) {
        alert('Ошибка');
      }
    });

    // Первоначальная загрузка
    refreshFeed();
  </script>
</body>
</html>
